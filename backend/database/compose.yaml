
services:
  db:
    image: postgres:17
    container_name: cstu-nexus-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cstu_nexus_db
      POSTGRES_USER: cstu_nexus_user
      POSTGRES_PASSWORD: dev_password_123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cstu_nexus_user -d cstu_nexus_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../cstu-course-nexus
      dockerfile: Dockerfile
    container_name: cstu-nexus-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cstu_nexus_db
      SPRING_DATASOURCE_USERNAME: cstu_nexus_user
      SPRING_DATASOURCE_PASSWORD: dev_password_123
      TU_API_APPLICATION_KEY: ${TU_API_APPLICATION_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
    ports:
      - "8080:8080"


volumes:
  postgres_data:
    name: database_postgres_data
