spring.application.name=cstu-course-nexus
# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cstu_nexus_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cstu_nexus_user}
spring.datasource.password=${DB_PASSWORD:dev_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# TU AD authentication; keep the Application Key outside source control.
tu.auth.verify-url=https://restapi.tu.ac.th/api/v1/auth/Ad/verify
tu.auth.application-key=${TU_API_APPLICATION_KEY:}

# Comma-separated frontend origins, for example http://localhost:5500
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500}

# The browser session contains the authenticated TU profile, not the TU password.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
