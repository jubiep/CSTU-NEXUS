<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – โปรไฟล์</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/profile.css"/>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <header id="topbar"></header>

    <main class="page-content profile-page">
      <div class="profile-card">
        <img class="avatar" src="../src/profile-pic.jpg" alt="Profile photo"/>

        <div class="profile-name" id="p-name"></div>
        <div class="student-id" id="p-id"></div>

        <div class="verified-box" aria-label="verified status">
          <img class="verified-mark" src="../src/verify-icon.png" alt="" aria-hidden="true"/>
          <div class="verified-copy">
            <p id="p-faculty"></p>
            <p id="p-program"></p>
            <p>ชั้นปีที่ <span id="p-year"></span></p>
          </div>
        </div>
      </div>

      <a class="preferences-card" href="#" onclick="return false;" style="cursor: default;" aria-label="Preferences">
        <img class="preferences-icon" src="../src/Preferences-logo.png" alt="" aria-hidden="true"/>
        <span>Preferences</span>
        <svg class="preferences-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 5 7 7-7 7"/>
        </svg>
      </a>

      <a class="course-reference" href="../src/2568_CS@TU_Orientation_Final%202.pdf" target="_blank" rel="noopener noreferrer">
        หลักสูตรอ้างอิง
      </a>
    </main>
  </div>

  <script src="../app.js"></script>
  <script>
    requireAuth();
    renderTopbar();

    const nameEl = document.getElementById("p-name");
    const idEl = document.getElementById("p-id");
    const facultyEl = document.getElementById("p-faculty");
    const programEl = document.getElementById("p-program");
    const yearEl = document.getElementById("p-year");

    if (currentUser && currentUser.name) {
      const parts = currentUser.name.split(" ");
      if (parts.length > 1) {
        nameEl.innerHTML = `${parts[0]} <span>${parts.slice(1).join(" ")}</span>`;
      } else {
        nameEl.textContent = currentUser.name;
      }
    }
    if (currentUser && currentUser.studentId) {
      idEl.textContent = currentUser.studentId;
    }
    if (currentUser && currentUser.faculty) {
      const [faculty, ...program] = currentUser.faculty.split(" สาขา");
      facultyEl.textContent = faculty;
      programEl.textContent = program.length ? `สาขา${program.join(" สาขา")}` : "";
    }
    if (currentUser && currentUser.year) {
      yearEl.textContent = currentUser.year;
    }
  </script>
</body>
</html>
