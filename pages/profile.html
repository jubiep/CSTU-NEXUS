<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <title>CSTU NEXUS – โปรไฟล์</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/profile.css"/>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <header id="topbar"></header>

    <div class="page-content">
      <!-- Profile banner -->
      <div class="profile-banner">
        <div class="avatar">👩‍💻</div>
        <div class="profile-info">
          <div class="name" id="p-name"></div>
          <div class="student-id" id="p-id"></div>
          <div class="badge-verified mt-8">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:13px;height:13px"><polyline points="20 6 9 17 4 12"/></svg>
            CSTU Verified · ชั้นปีที่ <span id="p-year"></span>
          </div>
        </div>
      </div>

      <div style="font-size:13px;color:var(--gray-400);margin-bottom:20px;" id="p-faculty"></div>

      <hr class="divider"/>

      <!-- My reviews -->
      <div class="section-header">
        <span class="section-title">รีวิวของฉัน</span>
        <span class="text-muted">0 รีวิว</span>
      </div>

      <p style="text-align:center;color:var(--gray-400);padding:32px 0;font-size:14px;">
        ยังไม่มีรีวิว<br/>
        <a href="courses.html" style="color:var(--red);font-size:13px;text-decoration:none;">เริ่มรีวิวรายวิชาแรก →</a>
      </p>

      <hr class="divider"/>

      <a href="#" class="pref-row" onclick="logout(); return false;" style="color:var(--red);">
        <div class="pref-row-left">
          <div class="pref-icon" style="background:#FFEBEE;">🚪</div>
          <span class="pref-text" style="color:var(--red);">ออกจากระบบ</span>
        </div>
      </a>

    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script src="../app.js"></script>
  <script>
    requireAuth();
    renderTopbar();
    renderNav("profile");

    document.getElementById("p-name").textContent    = currentUser.name;
    document.getElementById("p-id").textContent      = currentUser.studentId;
    document.getElementById("p-year").textContent    = currentUser.year;
    document.getElementById("p-faculty").textContent = currentUser.faculty;
  </script>
</body>
</html>
