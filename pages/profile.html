<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <title>CSTU NEXUS – โปรไฟล์</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/profile.css"/>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="topbar-logo" href="dashboard.html" aria-label="ไปหน้าหลัก">CSTU <span>NEXUS</span></a>
      <button class="btn-logout" type="button" onclick="logout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Log out</span>
      </button>
    </header>

    <main class="page-content profile-page">
      <div class="profile-card">
        <div class="avatar" aria-label="profile photo">
          <div class="hair"></div>
          <div class="face"></div>
          <div class="neck"></div>
          <div class="body"></div>
        </div>

        <div class="profile-name" id="p-name">มะละกอ <span>ส้มต้า</span></div>
        <div class="student-id" id="p-id">68096970670</div>

        <div class="verified-box" aria-label="verified status">
          <div class="verified-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="verified-copy">
            <p>คณะวิทยาศาสตร์และเทคโนโลยี</p>
            <p>สาขาวิทยาการคอมพิวเตอร์</p>
            <p>ชั้นปีที่ <span id="p-year">2</span></p>
          </div>
        </div>
      </div>

      <div class="preferences-card" aria-label="Preferences">
        <div class="preferences-icon">✚</div>
        <span>Preferences</span>
      </div>

      <div class="course-reference">หลักสูตรอ้างอิง</div>
    </main>
  </div>

  <script src="../app.js"></script>
  <script>
    requireAuth();
    renderNav("profile");

    const nameEl = document.getElementById("p-name");
    const idEl = document.getElementById("p-id");
    const yearEl = document.getElementById("p-year");

    if (currentUser && currentUser.name) {
      nameEl.textContent = currentUser.name;
    }
    if (currentUser && currentUser.studentId) {
      idEl.textContent = currentUser.studentId;
    }
    if (currentUser && currentUser.year) {
      yearEl.textContent = currentUser.year;
    }
  </script>
</body>
</html>
