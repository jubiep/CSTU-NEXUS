<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <title>CSTU NEXUS – หน้าหลัก</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <header id="topbar"></header>

    <!-- Content -->
    <div class="page-content">

      <!-- Profile banner -->
      <div class="profile-banner">
        <div class="avatar">👩‍💻</div>
        <div class="profile-info">
          <div class="name" id="user-name">มะละกอ สันตำ</div>
          <div class="student-id" id="user-id">6809670670</div>
          <div class="badge-verified">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            CSTU Verified · ชั้นปีที่ 2
          </div>
          <div style="font-size:11px;color:var(--gray-600);margin-top:4px;" id="user-faculty">คณะวิทยาศาสตร์และเทคโนโลยี สาขาวิทยาการคอมพิวเตอร์</div>
        </div>
      </div>

      <!-- Quick actions -->
      <div class="section-header">
        <span class="section-title">เมนูหลัก</span>
      </div>

      <a class="pref-row" href="courses.html">
        <div class="pref-row-left">
          <div class="pref-icon">📚</div>
          <span class="pref-text">ค้นหารายวิชา</span>
        </div>
        <span class="pref-arrow">›</span>
      </a>

      <a class="pref-row" href="preferences.html">
        <div class="pref-row-left">
          <div class="pref-icon">⚙️</div>
          <span class="pref-text">Preferences (ความชอบของฉัน)</span>
        </div>
        <span class="pref-arrow">›</span>
      </a>

      <a class="pref-row" href="profile.html">
        <div class="pref-row-left">
          <div class="pref-icon">👤</div>
          <span class="pref-text">โปรไฟล์ของฉัน</span>
        </div>
        <span class="pref-arrow">›</span>
      </a>

      <hr class="divider"/>

      <!-- Recent courses -->
      <div class="section-header">
        <span class="section-title">รายวิชายอดนิยม</span>
        <a href="courses.html" style="font-size:13px;color:var(--red);text-decoration:none;">ดูทั้งหมด</a>
      </div>

      <div class="course-grid" id="featured-courses"></div>
    </div>

    <!-- Bottom nav -->
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script src="../app.js"></script>
  <script>
    requireAuth();
    renderTopbar();
    renderNav("home");

    // Fill user info
    document.getElementById("user-name").textContent = currentUser.name;
    document.getElementById("user-id").textContent = currentUser.studentId;
    document.getElementById("user-faculty").textContent = currentUser.faculty;

    // Featured courses (first 6)
    const grid = document.getElementById("featured-courses");
    mockCourses.slice(0, 6).forEach(c => {
      grid.innerHTML += `
        <a class="course-card" href="course-detail.html?code=${c.code}">
          <div class="course-code">${c.code}</div>
          <div class="course-name">${c.name}</div>
        </a>`;
    });
  </script>
</body>
</html>
