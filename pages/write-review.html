<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <title>CSTU NEXUS – เขียนรีวิว</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/write-review.css"/>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <a id="back-btn" href="#" style="color:var(--white);font-size:22px;text-decoration:none;line-height:1;">‹</a>
      <span class="topbar-title" id="topbar-code">เขียนรีวิว</span>
    </div>

    <div class="page-content">
      <!-- Course info -->
       <div class="course-detail-header">
        <div class="course-header-left">
          <div class="course-accent-bar"></div>
          <div class="course-header-info">
            <h1 class="course-code" id="detail-code"></h1>
            <div class="course-fullname" id="detail-name"></div>
            <div class="course-teacher" id="detail-teacher"></div>
          </div>
        </div>
        <button class="section-pill-btn" id="section-badge" onclick="toggleSection()" type="button">
          <span>Section</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <!-- Section selector (hidden by default) -->
      <div id="section-panel" class="section-panel" style="display:none;">
        <div class="card" style="padding:12px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--gray-600);">เลือก Section</div>
          <div id="section-list" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>
      </div>

      <!-- Write some Review Section -->
      <div class="section-title-wrap">
        <div class="section-accent-bar"></div>
        <h2 class="section-title-text">Write some Review</h2>
      </div>

      <!-- Review Input Card -->
      <div class="review-input-card">
        <div class="review-input-header">
          รายละเอียดเพิ่มเติม
        </div>

        <div class="review-textarea-wrap">
          <textarea id="review-text" class="review-textarea" placeholder="เช่น สอนช้า เร็ว ปานกลาง มีวิดีโอบันทึกย้อนหลัง&#10;มีการเช็คชื่อ หรือมีการสุ่มตอบคำถาม เป็นต้น" rows="3"></textarea>
        </div>

        <div class="review-notice">
          <svg viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>กรุณาแบ่งปันประสบการณ์อย่างสุภาพ</span>
        </div>
      </div>

      <!-- Validation error -->
      <div id="form-error" class="error-msg" style="display:none;margin-bottom:14px;">
        กรุณาเขียนรีวิวก่อนส่ง
      </div>

      <!-- Submit button -->
      <div class="review-submit-wrap">
        <button class="btn-submit-review" onclick="submitReview()" type="button">ส่ง</button>
      </div>
      <span id="inline-code" style="display:none;"></span>
    </div>

    <!-- Success modal -->
    <div class="modal-overlay" id="success-modal">
      <div class="modal-box">
        <div class="modal-icon">✓</div>
        <div class="modal-title">รีวิวเสร็จสิ้น</div>
        <button class="btn btn-primary btn-full" onclick="goBack()">ย้อนกลับ</button>
      </div>
    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script src="../app.js"></script>
  <script>
    requireAuth();
    renderNav("search");

    const code = getParam("code") || "CS261";
    const course = getCourse(code);

    document.getElementById("back-btn").href = `course-detail.html?code=${code}`;
    document.getElementById("topbar-code").textContent = code;
    document.getElementById("detail-code").textContent = code;
    document.getElementById("inline-code").textContent = code;
    if (course) {
      document.getElementById("detail-name").textContent = course.name;
      document.getElementById("detail-teacher").textContent = course.teacher;

      // Section list
      const sectionList = document.getElementById("section-list");
      if (sectionList && course.sections) {
        course.sections.forEach(s => {
          const btn = document.createElement("button");
          btn.className = "btn btn-outline btn-sm";
          btn.textContent = "Section " + s;
          btn.onclick = () => {
            const badgeText = document.querySelector("#section-badge span");
            if (badgeText) badgeText.textContent = "Section " + s;
            toggleSection();
          };
          sectionList.appendChild(btn);
        });
      }
    }

    function toggleSection() {
      const panel = document.getElementById("section-panel");
      const btn = document.getElementById("section-badge");
      if (!panel) return;
      const isHidden = panel.style.display === "none" || !panel.style.display;
      panel.style.display = isHidden ? "block" : "none";
      if (btn) btn.classList.toggle("open", isHidden);
    }

    function submitReview() {
      const text = document.getElementById("review-text").value.trim();
      const errEl = document.getElementById("form-error");

      if (!text) {
        errEl.style.display = "block";
        document.getElementById("review-text").focus();
        return;
      }
      errEl.style.display = "none";

      // TODO: POST /api/reviews
      // Mock: แสดง success modal
      document.getElementById("success-modal").classList.add("show");
    }

    function goBack() {
      window.location.href = `course-detail.html?code=${code}`;
    }
  </script>
</body>
</html>
