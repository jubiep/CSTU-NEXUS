<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <title>CSTU NEXUS – เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/login.css"/>
  
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        CSTU <span>NEXUS</span>
        <svg viewBox="0 0 198 28" aria-hidden="true">
          <defs>
            <linearGradient id="logo-swoosh" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#c42132"/>
              <stop offset=".55" stop-color="#e28a45"/>
              <stop offset="1" stop-color="#f8d15a"/>
            </linearGradient>
          </defs>
          <path d="M3 24 C20 2, 69 8, 112 10 S183 12, 195 1" fill="none" stroke="url(#logo-swoosh)" stroke-width="2.5"/>
        </svg>
      </div>

      <div class="error-msg" id="error-msg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

      <div class="form-group">
        <input class="form-input" type="email" id="username" placeholder="email@dome.tu.ac.th" autocomplete="username" aria-label="อีเมล"/>
      </div>

      <div class="form-group">
        <input class="form-input" type="password" id="password" placeholder="Password" autocomplete="current-password" aria-label="รหัสผ่าน"/>
      </div>

      <a href="#" class="forgot-link">Forgot Password?</a>

      <button class="btn btn-primary" onclick="doLogin()">Log in</button>

      <p class="login-note">
        ระบบใช้การยืนยันตัวตนผ่าน TU Authentication<br/>
        เฉพาะนักศึกษา CSTU มธ. เท่านั้น
      </p>
    </div>
  </div>

  <script src="../app.js"></script>
  <script>
    // ถ้า login แล้ว redirect ไป courses.html
    if (sessionStorage.getItem("cstu_logged_in")) {
      window.location.href = "courses.html";
    }

    function doLogin() {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value;
      const err = document.getElementById("error-msg");

      if (!u || !p) {
        err.textContent = "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";
        err.classList.add("show");
        return;
      }

      // TODO: เชื่อม TU Auth API
      // Mock: รับทุก credential
      sessionStorage.setItem("cstu_logged_in", "1");
      window.location.href = "courses.html";
    }

    // Enter key
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
