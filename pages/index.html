<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <title>CSTU NEXUS – เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/login.css"/>
  <style>
    body {
      background: #fff;
    }

    .login-wrap {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      padding: 24px;
      justify-content: center;
    }

    .login-card {
      position: relative;
      width: min(304px, 100%);
      height: 420px;
      padding: 151px 32px 32px;
      border: 1px solid #e2e2e2;
      border-radius: 32px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .28);
    }

    .login-logo {
      position: absolute;
      top: 43px;
      left: 0;
      width: 100%;
      margin: 0;
      background: linear-gradient(90deg, #bd2533 0%, #dc6840 55%, #f7cf58 100%);
      background-clip: text;
      color: transparent;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1.2px;
      text-align: center;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-logo span {
      color: inherit;
    }

    .login-logo svg {
      position: absolute;
      top: 34px;
      left: 50%;
      width: 198px;
      height: 28px;
      transform: translateX(-50%);
      overflow: visible;
    }

    .login-card .error-msg {
      margin: 0 0 12px;
    }

    .login-card .form-group {
      margin-bottom: 20px;
    }

    .login-card .form-input {
      height: 36px;
      padding: 0 19px;
      border: 1px solid #dedede;
      border-radius: 20px;
      background: #faf9f9;
      font-size: 12px;
    }

    .login-card .form-input::placeholder {
      color: #c9c7c7;
      opacity: 1;
    }

    .forgot-link {
      margin: -7px 0 13px;
      color: #111;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .login-card .btn {
      display: block;
      width: 85px;
      height: 30px;
      margin: 0 auto;
      padding: 0;
      border-radius: 18px;
      background: linear-gradient(100deg, #ffe28a, #f8ce50);
      color: #111;
      font-size: 14px;
      line-height: 30px;
    }

    .login-note {
      display: none;
    }

    @media (max-width: 600px) {
      .login-wrap {
        padding: 16px;
      }

      .login-card {
        width: min(396px, 82vw);
        height: min(550px, 114vw);
        padding: min(198px, 41vw) min(40px, 8.3vw) 32px;
        border-radius: min(40px, 8.2vw);
        box-shadow: 0 5px 14px rgba(0, 0, 0, .28);
      }

      .login-logo {
        top: min(61px, 12.5vw);
        font-size: min(44px, 9vw);
        letter-spacing: -1.5px;
        line-height: 1.2;
      }

      .login-logo svg {
        top: min(43px, 9vw);
        width: min(252px, 51.5vw);
        height: min(36px, 7.4vw);
      }

      .login-card .form-group {
        margin-bottom: min(25px, 5.1vw);
      }

      .login-card .error-msg {
        margin-bottom: min(16px, 3.3vw);
      }

      .login-card .form-input {
        height: min(48px, 9.8vw);
        padding: 0 min(25px, 5.1vw);
        border-radius: min(20px, 4.1vw);
        font-size: max(12px, min(15px, 3.1vw));
      }

      .forgot-link {
        font-size: max(14px, min(17px, 3.5vw));
      }

      .login-card .btn {
        width: min(111px, 22.7vw);
        height: min(39px, 8vw);
        font-size: max(14px, min(18px, 3.7vw));
        line-height: min(39px, 8vw);
      }
    }

  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        CSTU <span>NEXUS</span>
        <svg viewBox="0 0 198 28" aria-hidden="true">
          <defs>
            <linearGradient id="logo-swoosh" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#c42132"/>
              <stop offset=".55" stop-color="#e28a45"/>
              <stop offset="1" stop-color="#f8d15a"/>
            </linearGradient>
          </defs>
          <path d="M3 24 C20 2, 69 8, 112 10 S183 12, 195 1" fill="none" stroke="url(#logo-swoosh)" stroke-width="2.5"/>
        </svg>
      </div>

      <div class="error-msg" id="error-msg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

      <div class="form-group">
        <input class="form-input" type="email" id="username" placeholder="email@dome.tu.ac.th" autocomplete="username" aria-label="อีเมล"/>
      </div>

      <div class="form-group">
        <input class="form-input" type="password" id="password" placeholder="Password" autocomplete="current-password" aria-label="รหัสผ่าน"/>
      </div>

      <a href="#" class="forgot-link">Forgot Password?</a>

      <button class="btn btn-primary" onclick="doLogin()">Log in</button>

      <p class="login-note">
        ระบบใช้การยืนยันตัวตนผ่าน TU Authentication<br/>
        เฉพาะนักศึกษา CSTU มธ. เท่านั้น
      </p>
    </div>
  </div>

  <script src="../app.js"></script>
  <script>
    // Redirect logged-in users to the courses page.
    if (sessionStorage.getItem("cstu_logged_in")) {
      window.location.href = "courses.html";
    }

    function doLogin() {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value;
      const err = document.getElementById("error-msg");

      if (!u || !p) {
        err.textContent = "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";
        err.classList.add("show");
        return;
      }

      // TODO: เชื่อม TU Auth API
      // Mock: รับทุก credential
      sessionStorage.setItem("cstu_logged_in", "1");
      window.location.href = "courses.html";
    }

    // Enter key
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
