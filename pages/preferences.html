<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <title>CSTU NEXUS – Preferences</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/preferences.css"/>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <a href="profile.html" style="color:var(--white);font-size:22px;text-decoration:none;line-height:1;">‹</a>
      <span class="topbar-title">Preferences</span>
      <span style="width:48px;"></span>
    </div>

    <div class="page-content">
      <p style="font-size:13px;color:var(--gray-400);margin-bottom:20px;">
        กำหนดความชอบของคุณเพื่อให้ระบบแนะนำ Section ที่เหมาะสม
      </p>

      <!-- สไตล์การเรียน -->
      <div class="rating-group">
        <span class="rating-label">สไตล์การสอนที่ชอบ</span>
        <div class="checkbox-list">
          <label class="checkbox-item"><input type="checkbox" name="pref_style" value="theory" id="p-theory"/> เน้นทฤษฎี / บรรยาย</label>
          <label class="checkbox-item"><input type="checkbox" name="pref_style" value="practice" id="p-practice"/> เน้นปฏิบัติ / Lab</label>
          <label class="checkbox-item"><input type="checkbox" name="pref_style" value="project" id="p-project"/> เน้นโปรเจกต์กลุ่ม</label>
          <label class="checkbox-item"><input type="checkbox" name="pref_style" value="exam" id="p-exam"/> เน้นสอบ / คะแนน</label>
        </div>
      </div>

      <!-- Workload -->
      <div class="rating-group">
        <span class="rating-label">ปริมาณงานที่รับได้</span>
        <div class="checkbox-list">
          <label class="checkbox-item"><input type="radio" name="pref_workload" value="light"/> เบา — งานน้อย ไม่กดดัน</label>
          <label class="checkbox-item"><input type="radio" name="pref_workload" value="medium"/> กลาง — พอดี ท้าทายบ้าง</label>
          <label class="checkbox-item"><input type="radio" name="pref_workload" value="heavy"/> หนัก — ยอมเหนื่อยเพื่อความรู้</label>
        </div>
      </div>

      <!-- Project type -->
      <div class="rating-group">
        <span class="rating-label">รูปแบบงานที่ชอบ</span>
        <div class="checkbox-list">
          <label class="checkbox-item"><input type="checkbox" name="pref_format" value="solo"/> งานเดี่ยว</label>
          <label class="checkbox-item"><input type="checkbox" name="pref_format" value="group"/> งานกลุ่ม</label>
        </div>
      </div>

      <!-- รายวิชา -->
      <div class="form-group">
        <label class="form-label">รายวิชาที่สนใจลงทะเบียน (ระบุรหัสวิชา)</label>
        <input class="form-input" type="text" id="pref-courses" placeholder="เช่น CS261, CS270, MA201"/>
      </div>

      <div id="pref-success" style="display:none;background:#E8F5E9;color:#2E7D32;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;">
        บันทึก Preferences เรียบร้อยแล้ว ✓
      </div>

      <button class="btn btn-primary btn-full" onclick="savePrefs()">บันทึก Preferences</button>

      <div style="margin-top:12px;">
        <a href="courses.html" class="btn btn-outline btn-full">กลับหน้ารายวิชา</a>
      </div>
    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script src="../app.js"></script>
  <script>
    requireAuth();
    renderNav("profile");

    // Load saved prefs from sessionStorage (mock)
    const saved = JSON.parse(sessionStorage.getItem("cstu_prefs") || "{}");
    if (saved.courses) document.getElementById("pref-courses").value = saved.courses;
    if (saved.workload) {
      const el = document.querySelector(`input[name="pref_workload"][value="${saved.workload}"]`);
      if (el) el.checked = true;
    }
    (saved.styles || []).forEach(v => {
      const el = document.querySelector(`input[name="pref_style"][value="${v}"]`);
      if (el) el.checked = true;
    });

    function savePrefs() {
      const styles  = [...document.querySelectorAll('input[name="pref_style"]:checked')].map(e => e.value);
      const workload = document.querySelector('input[name="pref_workload"]:checked')?.value || "";
      const courses = document.getElementById("pref-courses").value.trim();

      const prefs = { styles, workload, courses };
      sessionStorage.setItem("cstu_prefs", JSON.stringify(prefs));

      // TODO: POST /api/users/preferences
      document.getElementById("pref-success").style.display = "block";
      setTimeout(() => document.getElementById("pref-success").style.display = "none", 3000);
    }
  </script>
</body>
</html>
