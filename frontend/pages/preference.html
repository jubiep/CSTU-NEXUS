<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – Preferences</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/preference.css"/>
</head>
<body>
  <div class="app-shell">
    <header id="topbar"></header>

    <main class="page-content preference-page">
      <div class="preference-heading">
        <h1>Preferences</h1>

      <form id="preference-form">

            <div class="preference-hearts" role="radiogroup" aria-label="แนวทางการสอน">
              <label class="heart-choice"><input type="radio" name="teachingApproach" value="1"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="teachingApproach" value="2"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="teachingApproach" value="3"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
            </div>
            <div class="preference-range"><span>เน้นทฤษฎี</span><span>เน้นปฏิบัติ</span></div>
          </fieldset>

          <fieldset class="preference-card" data-preference="gradingStyle" data-rating="3">
            <legend>สัดส่วนการวัดผลและตัดเกรด</legend>
            <div class="preference-hearts" role="radiogroup" aria-label="สัดส่วนการวัดผลและตัดเกรด">
              <label class="heart-choice"><input type="radio" name="gradingStyle" value="1"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="gradingStyle" value="2"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="gradingStyle" value="3"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
            </div>
            <div class="preference-range"><span>เน้นสอบ</span><span>เน้นโครงงาน</span></div>
          </fieldset>

          <fieldset class="preference-card" data-preference="teachingPace" data-rating="5">
            <legend>ความเร็วในการสอน</legend>
            <div class="preference-hearts" role="radiogroup" aria-label="ความเร็วในการสอน">
              <label class="heart-choice"><input type="radio" name="teachingPace" value="1"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="teachingPace" value="2"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="teachingPace" value="3"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="teachingPace" value="4"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="teachingPace" value="5"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
            </div>
            <div class="preference-range"><span>สอนช้ามาก</span><span>สอนเร็วมาก</span></div>
          </fieldset>

          <fieldset class="preference-card" data-preference="assignmentStyle" data-rating="3">
            <legend>รูปแบบงาน</legend>
            <div class="preference-hearts" role="radiogroup" aria-label="รูปแบบงาน">
              <label class="heart-choice"><input type="radio" name="assignmentStyle" value="1"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="assignmentStyle" value="2"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="assignmentStyle" value="3"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
            </div>
            <div class="preference-range"><span>งานเดี่ยว</span><span>งานกลุ่ม</span></div>
          </fieldset>

          <fieldset class="preference-card" data-preference="workload" data-rating="5">
            <legend>ปริมาณงาน</legend>
            <div class="preference-hearts" role="radiogroup" aria-label="ปริมาณงาน">
              <label class="heart-choice"><input type="radio" name="workload" value="1"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="workload" value="2"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="workload" value="3"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="workload" value="4"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
              <label class="heart-choice"><input type="radio" name="workload" value="5"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg></label>
            </div>
            <div class="preference-range"><span>รับงานได้น้อย</span><span>รับงานได้มาก</span></div>
          </fieldset>
        </div>

        <p id="preference-status" class="preference-status" role="status" aria-live="polite" hidden></p>
        <div class="preference-actions">
          <a class="btn preference-back" href="profile.html">ย้อนกลับ</a>
          <button class="btn btn-primary preference-save" type="submit">บันทึก</button>
        </div>
      </form>
    </main>
  </div>

  <dialog class="save-dialog" id="save-dialog" aria-labelledby="save-dialog-title" aria-describedby="save-dialog-message">
    <div class="save-dialog-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="m6 12.5 4 4L18.5 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 id="save-dialog-title">บันทึกเสร็จสิ้น</h2>
    <p id="save-dialog-message">บันทึก Preferences ของคุณเรียบร้อยแล้ว</p>
    <form method="dialog">
      <button class="btn btn-primary save-dialog-button" type="submit">ตกลง</button>
    </form>
  </dialog>

  <script src="../app.js"></script>
  <script>
    const preferenceForm = document.getElementById("preference-form");
    const preferenceStatus = document.getElementById("preference-status");
    const saveDialog = document.getElementById("save-dialog");
    const preferencesStorageKey = "cstu_preferences";

    document.querySelectorAll(".preference-card").forEach(card => {
      card.querySelectorAll('input[type="radio"]').forEach((input, index) => {
        input.setAttribute("aria-label", `${index + 1} จาก ${card.dataset.rating}`);
      });
      card.addEventListener("change", () => updatePreferenceHearts(card));
    });

    function updatePreferenceHearts(card) {
      const selectedInput = card.querySelector("input:checked");
      const selectedRating = selectedInput ? Number(selectedInput.value) : 0;
      card.querySelectorAll(".heart-choice").forEach(choice => {
        const rating = Number(choice.querySelector("input").value);
        choice.classList.toggle("is-filled", rating <= selectedRating);
      });
    }

    function showPreferenceStatus(message, isError = false) {
      preferenceStatus.textContent = message;
      preferenceStatus.classList.toggle("is-error", isError);
      preferenceStatus.hidden = false;
      preferenceStatus.setAttribute("role", isError ? "alert" : "status");
    }

    function restorePreferences() {
      const saved = localStorage.getItem(preferencesStorageKey);
      if (saved === null) return;

      const preferences = JSON.parse(saved);
      if (!preferences || typeof preferences !== "object" || Array.isArray(preferences)) {
        throw new Error("รูปแบบข้อมูล Preferences ที่บันทึกไว้ไม่ถูกต้อง");
      }

      document.querySelectorAll(".preference-card").forEach(card => {
        const key = card.dataset.preference;
        const rating = preferences[key];
        const maxRating = Number(card.dataset.rating);
        if (rating === undefined) return;
        if (!Number.isInteger(rating) || rating < 1 || rating > maxRating) {
          throw new Error(`คะแนน Preferences ของ ${card.querySelector("legend").textContent} ไม่ถูกต้อง`);
        }
        const input = card.querySelector(`input[value="${rating}"]`);
        if (input) input.checked = true;
        updatePreferenceHearts(card);
      });
    }

    preferenceForm.addEventListener("submit", event => {
      event.preventDefault();
      const preferences = {};
      document.querySelectorAll(".preference-card").forEach(card => {
        const selected = card.querySelector("input:checked");
        if (selected) preferences[card.dataset.preference] = Number(selected.value);
      });

      try {
        localStorage.setItem(preferencesStorageKey, JSON.stringify(preferences));
        saveDialog.showModal();
      } catch (error) {
        console.error("Unable to save preferences:", error);
        showPreferenceStatus("บันทึก Preferences ไม่สำเร็จ กรุณาลองอีกครั้ง", true);
      }
    });

    async function initializePreferencePage() {
      const user = await requireAuth();
      if (!user) return;
      renderTopbar();

      try {
        restorePreferences();
      } catch (error) {
        console.error("Unable to load preferences:", error);
        showPreferenceStatus(error.message || "โหลด Preferences ไม่สำเร็จ", true);
      }
    }

    initializePreferencePage();
  </script>
</body>
</html>
