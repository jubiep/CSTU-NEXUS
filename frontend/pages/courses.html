<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – รายวิชา</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/courses.css"/>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <header id="topbar"></header>

    <!-- Content -->
    <div class="page-content">

      <!-- Profile banner -->
      <a class="profile-banner" href="profile.html">
        <div class="avatar-wrapper">
          <img class="avatar" src="../src/profile-pic.jpg" alt="Profile photo" width="136" height="136"/>
          <div class="verified-badge">
            <img src="../src/verify-icon.png" alt="verified icon" height="40"/>
          </div>
        </div>
        <div class="profile-info">
          <div class="name" id="user-name">กำลังโหลดข้อมูลโปรไฟล์...</div>
          <div class="student-id" id="user-id"></div>
        </div>
      </a>
      <div class="profile-load-error" id="profile-load-error" role="alert" aria-live="polite" hidden>
        <span id="profile-load-error-message"></span>
        <button class="btn btn-outline btn-sm" id="profile-retry" type="button">ลองอีกครั้ง</button>
      </div>

      <!-- Search -->
      <div class="search-wrap">
        <img class="search-icon" src="../src/search-icon.png" alt="search icon" height="18" width="18"/>
        <input class="search-input" type="text" id="search-input" placeholder="ค้นหารหัสวิชา หรือชื่อวิชา..." oninput="handleSearchInput()"/>
        
        <!-- เพิ่มปุ่มล้างคำค้นหา (Clear / X) -->
        <button type="button" id="clear-btn" class="clear-btn" onclick="clearSearch()" aria-label="ล้างคำค้นหา">&times;</button>
      </div>

      <!-- Filter Dropdowns Row -->
      <div class="filter-dropdowns-row">
        <!-- หมวดหมู่ Dropdown (Multi-select Checkbox) -->
        <div class="dropdown" id="category-dropdown">
          <button type="button" class="dropdown-btn" id="category-dropdown-btn" onclick="toggleDropdown(event, 'category-dropdown')" aria-haspopup="true" aria-expanded="false">
            <span id="category-dropdown-label">หมวดหมู่</span>
            <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="dropdown-menu" id="category-dropdown-menu" role="menu">
            <label class="dropdown-checkbox-item">
              <input type="checkbox" value="CS" onchange="handleCategoryCheckboxChange()"/>
              <span class="custom-checkbox"></span>
              <span class="checkbox-label">CS</span>
            </label>
            <label class="dropdown-checkbox-item">
              <input type="checkbox" value="TU" onchange="handleCategoryCheckboxChange()"/>
              <span class="custom-checkbox"></span>
              <span class="checkbox-label">TU</span>
            </label>
            <label class="dropdown-checkbox-item">
              <input type="checkbox" value="EL" onchange="handleCategoryCheckboxChange()"/>
              <span class="custom-checkbox"></span>
              <span class="checkbox-label">EL</span>
            </label>
            <label class="dropdown-checkbox-item">
              <input type="checkbox" value="ST" onchange="handleCategoryCheckboxChange()"/>
              <span class="custom-checkbox"></span>
              <span class="checkbox-label">ST</span>
            </label>
            <label class="dropdown-checkbox-item">
              <input type="checkbox" value="OTHER" onchange="handleCategoryCheckboxChange()"/>
              <span class="custom-checkbox"></span>
              <span class="checkbox-label">อื่นๆ (MA, LAS)</span>
            </label>
          </div>
        </div>

        <!-- ชั้นปี Dropdown (Single-select: เลือกแล้วขึ้นสีแดง ไม่ปิดเมนูทันที) -->
        <div class="dropdown" id="year-dropdown">
          <button type="button" class="dropdown-btn" id="year-dropdown-btn" onclick="toggleDropdown(event, 'year-dropdown')" aria-haspopup="true" aria-expanded="false">
            <span id="year-dropdown-label">ชั้นปี</span>
            <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="dropdown-menu" id="year-dropdown-menu" role="menu">
            <div class="dropdown-item" data-year="1" onclick="selectYearSingle(event, '1')">ปี 1</div>
            <div class="dropdown-item" data-year="2" onclick="selectYearSingle(event, '2')">ปี 2</div>
            <div class="dropdown-item" data-year="3" onclick="selectYearSingle(event, '3')">ปี 3</div>
            <div class="dropdown-item" data-year="4" onclick="selectYearSingle(event, '4')">ปี 4</div>
          </div>
        </div>
      </div>

      <!-- Active Filters Bar / Reset -->
      <div class="filter-action-bar" id="filter-action-bar" style="display:none;">
        <span class="filter-result-count" id="filter-result-count">พบ 0 รายวิชา</span>
        <button type="button" class="btn-reset-filters" id="reset-filters-btn" onclick="resetAllFilters()">ล้างตัวกรอง</button>
      </div>

      <div class="course-grid" id="course-grid"></div>

      <!-- แก้ไขข้อความตาม Test case 2 -->
      <p id="empty-msg" style="display:none;text-align:center;color:var(--gray-400);padding:32px 0;font-size:14px;">
        ไม่พบรายวิชาที่ตรงกับการค้นหา
      </p>
    </div>
  </div>

  <script src="../app.js"></script>
  <script>
    const userNameEl = document.getElementById("user-name");
    const userIdEl = document.getElementById("user-id");
    const profileLoadError = document.getElementById("profile-load-error");
    const profileLoadErrorMessage = document.getElementById("profile-load-error-message");
    const profileRetryButton = document.getElementById("profile-retry");

    async function loadCurrentUser(verifiedUser) {
      if (!userNameEl) return;
      if (profileLoadError) profileLoadError.hidden = true;
      if (profileRetryButton) profileRetryButton.disabled = true;
      userNameEl.textContent = "กำลังโหลดข้อมูลโปรไฟล์...";
      if (userIdEl) userIdEl.textContent = "";

      try {
        const user = verifiedUser || await apiRequest("/auth/me");
        if (!user || typeof user.displayName !== "string" || !user.displayName.trim() ||
            typeof user.studentId !== "string" || !user.studentId.trim()) {
          throw new Error("ข้อมูลโปรไฟล์จาก backend ไม่ครบ");
        }

        userNameEl.textContent = user.displayName;
        if (userIdEl) userIdEl.textContent = user.studentId;
      } catch (error) {
        userNameEl.textContent = "โหลดข้อมูลโปรไฟล์ไม่สำเร็จ";
        if (profileLoadErrorMessage) {
          profileLoadErrorMessage.textContent = error instanceof TypeError
            ? "เชื่อมต่อ backend ไม่ได้"
            : error.message || "โหลดข้อมูลโปรไฟล์ไม่สำเร็จ";
        }
        if (profileLoadError) profileLoadError.hidden = false;
      } finally {
        if (profileRetryButton) profileRetryButton.disabled = false;
      }
    }

    if (profileRetryButton) {
      profileRetryButton.addEventListener("click", loadCurrentUser);
    }

    const searchInput = document.getElementById("search-input");
    const clearBtn = document.getElementById("clear-btn");
    const grid = document.getElementById("course-grid");
    const emptyMsg = document.getElementById("empty-msg");
    let debounceTimer = null;
    let selectedYear = "";
    let selectedCategories = [];

    // จัดการเปิด/ปิด Dropdown
    function toggleDropdown(event, id) {
      event.stopPropagation();
      const target = document.getElementById(id);
      const isOpen = target.classList.contains("open");
      closeAllDropdowns();
      if (!isOpen) {
        target.classList.add("open");
        const btn = target.querySelector(".dropdown-btn");
        if (btn) btn.setAttribute("aria-expanded", "true");
      }
    }

    function closeAllDropdowns() {
      document.querySelectorAll(".dropdown").forEach(d => {
        d.classList.remove("open");
        const btn = d.querySelector(".dropdown-btn");
        if (btn) btn.setAttribute("aria-expanded", "false");
      });
    }

    // คลิกนอก Dropdown ให้ปิดเมนูอัตโนมัติ
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".dropdown")) {
        closeAllDropdowns();
      }
    });

    // ป้องกันการปิดเมื่อคลิกข้างใน dropdown-menu ใด ๆ (ทั้งหมวดหมู่ และ ชั้นปี)
    document.querySelectorAll(".dropdown-menu").forEach(menu => {
      menu.addEventListener("click", (e) => {
        e.stopPropagation();
      });
    });

    function handleCategoryCheckboxChange() {
      const checkedBoxes = Array.from(document.querySelectorAll("#category-dropdown-menu input[type='checkbox']:checked"));
      selectedCategories = checkedBoxes.map(cb => cb.value);

      const labelEl = document.getElementById("category-dropdown-label");
      const btn = document.getElementById("category-dropdown-btn");

      if (selectedCategories.length === 0) {
        labelEl.textContent = "หมวดหมู่";
        btn.classList.remove("has-value");
      } else if (selectedCategories.length === 1) {
        const val = selectedCategories[0];
        labelEl.textContent = val === "OTHER" ? "อื่นๆ" : val;
        btn.classList.add("has-value");
      } else {
        labelEl.textContent = `หมวดหมู่ (${selectedCategories.length})`;
        btn.classList.add("has-value");
      }

      loadCourses(searchInput.value, selectedYear, selectedCategories);
    }

    // ฟังก์ชันเลือกชั้นปีแบบ Single-select (คลิกเลือกแล้วขึ้นสีแดง และไม่ปิด dropdown ทันที)
    function selectYearSingle(event, year) {
      if (event) event.stopPropagation();
      selectedYear = (selectedYear === year) ? "" : year;

      const labelEl = document.getElementById("year-dropdown-label");
      const btn = document.getElementById("year-dropdown-btn");

      if (selectedYear) {
        labelEl.textContent = `ปี ${selectedYear}`;
        btn.classList.add("has-value");
      } else {
        labelEl.textContent = "ชั้นปี";
        btn.classList.remove("has-value");
      }

      // แสดงสีแดงไฮไลต์บนตัวเลือกที่ถูกเลือก
      document.querySelectorAll("#year-dropdown-menu .dropdown-item").forEach(item => {
        item.classList.toggle("active", item.getAttribute("data-year") === selectedYear);
      });

      // อัปเดตรายวิชาแบบ Real-time โดยไม่ปิด dropdown
      loadCourses(searchInput.value, selectedYear, selectedCategories);
    }

    function updateActionBar(count) {
      const actionBar = document.getElementById("filter-action-bar");
      const countEl = document.getElementById("filter-result-count");
      const hasActive = Boolean((searchInput && searchInput.value.trim()) || selectedYear || selectedCategories.length > 0);
      if (actionBar) {
        actionBar.style.display = hasActive ? "flex" : "none";
      }
      if (countEl) {
        countEl.textContent = `พบ ${count} รายวิชา`;
      }
    }

    // Render รายการวิชา (รองรับ API: courseId, courseName, recommendedYear)
    function renderCourses(list) {
      if (!list || list.length === 0) {
        grid.innerHTML = "";
        emptyMsg.style.display = "block"; // แสดง "ไม่พบรายวิชาที่ตรงกับการค้นหา" (Test case 2)
        updateActionBar(0);
        let msg = "ไม่พบรายวิชาที่ตรงกับการค้นหา";
        if (selectedYear || selectedCategories.length > 0 || (searchInput && searchInput.value.trim())) {
          const parts = [];
          if (selectedYear) parts.push(`ชั้นปี ${selectedYear}`);
          if (selectedCategories.length > 0) parts.push(`หมวดหมู่ ${selectedCategories.map(c => c === 'OTHER' ? 'อื่นๆ (MA, LAS)' : c).join(', ')}`);
          if (searchInput && searchInput.value.trim()) parts.push(`คำค้นหา "${searchInput.value.trim()}"`);
          msg += ` (${parts.join(" + ")})`;
          if (selectedYear === "4" && selectedCategories.length === 0 && !(searchInput && searchInput.value.trim())) {
            msg += "<br><span style='color:var(--gray-400);font-size:12px;margin-top:4px;display:inline-block;'>* ปัจจุบันฐานข้อมูลยังไม่มีรายวิชาของชั้นปีที่ 4</span>";
          }
        }
        emptyMsg.innerHTML = msg;
        return;
      }
      emptyMsg.style.display = "none";
      updateActionBar(list.length);
      grid.innerHTML = list.map(c => {
        const code = c.courseId || c.code || "";
        const name = c.courseName || c.name || "";
        const year = c.recommendedYear ? `ปี ${c.recommendedYear}` : "";
        return `
        <a class="course-card" href="course-detail.html?code=${encodeURIComponent(code)}">
          <div class="course-indicator"></div>
          <div class="course-card-content">
            <div class="course-card-header">
              <span class="course-code">${code}</span>
              ${year ? `<span class="course-year-tag">${year}</span>` : ""}
            </div>
            <div class="course-name">${name}</div>
          </div>
        </a>
      `;
      }).join('');
    }

    // ฟังก์ชันยิง API ไปยัง Database
    async function loadCourses(keyword = "", year = selectedYear, categories = selectedCategories) {
      try {
        const courses = await apiFetchCourses({ keyword, year, categories });
        renderCourses(courses);
      } catch (err) {
        console.error("Failed to load courses:", err);
        renderCourses([]);
      }
    }

    function resetAllFilters() {
      searchInput.value = "";
      clearBtn.style.display = "none";
      selectedYear = "";
      selectedCategories = [];

      document.querySelectorAll("#category-dropdown-menu input[type='checkbox']").forEach(cb => cb.checked = false);
      document.querySelectorAll("#year-dropdown-menu .dropdown-item").forEach(item => item.classList.remove("active"));

      const catLabel = document.getElementById("category-dropdown-label");
      const yearLabel = document.getElementById("year-dropdown-label");
      const catBtn = document.getElementById("category-dropdown-btn");
      const yearBtn = document.getElementById("year-dropdown-btn");

      if (catLabel) catLabel.textContent = "หมวดหมู่";
      if (yearLabel) yearLabel.textContent = "ชั้นปี";
      if (catBtn) catBtn.classList.remove("has-value");
      if (yearBtn) yearBtn.classList.remove("has-value");

      closeAllDropdowns();
      loadCourses("", "", []);
    }

    // จัดการเมื่อมีการพิมพ์ค้นหา (Test case 1 & 3)
    function handleSearchInput() {
      const val = searchInput.value;
      clearBtn.style.display = val.length > 0 ? "flex" : "none";

      clearTimeout(debounceTimer);
      // หากลบจนว่าง ให้รีเซ็ตแสดงทั้งหมดตามฟิลเตอร์ทันที (Test case 3)
      if (val.trim() === "") {
        loadCourses("", selectedYear, selectedCategories);
        return;
      }
      // พิมพ์ค้นหาแบบ Real-time หน่วงเวลา 250ms (Test case 1)
      debounceTimer = setTimeout(() => {
        loadCourses(val, selectedYear, selectedCategories);
      }, 250);
    }

    // ฟังก์ชันปุ่มล้างคำค้นหา X (Test case 3)
    function clearSearch() {
      searchInput.value = "";
      clearBtn.style.display = "none";
      searchInput.focus();
      loadCourses("", selectedYear, selectedCategories);
    }

    async function initializeCoursesPage() {
      const verifiedUser = await requireAuth();
      if (!verifiedUser) return;

      renderTopbar();
      loadCurrentUser(verifiedUser);
      loadCourses("");
    }

    initializeCoursesPage();
  </script>
</body>
</html>
