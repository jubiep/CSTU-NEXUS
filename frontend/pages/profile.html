<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – โปรไฟล์</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/profile.css"/>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <header id="topbar"></header>

    <main class="page-content profile-page">
      <p id="profile-loading" class="profile-message" role="status">กำลังโหลดข้อมูลโปรไฟล์...</p>
      <div id="profile-error" class="error-msg profile-error" role="alert" aria-live="polite"></div>
      <button id="profile-retry" class="btn btn-primary profile-retry" type="button" hidden>ลองโหลดอีกครั้ง</button>

      <div class="profile-card" id="profile-card" hidden>
        <img class="avatar" src="../src/profile-pic.jpg" alt="Profile photo"/>

        <div class="profile-name" id="p-name"></div>
        <div class="student-id" id="p-id"></div>

        <div class="verified-box" aria-label="verified status">
          <img class="verified-mark" src="../src/verify-icon.png" alt="" aria-hidden="true"/>
          <div class="verified-copy">
            <p id="p-faculty"></p>
            <p id="p-program"></p>
            <p>ชั้นปีที่ <span id="p-year"></span></p>
          </div>
        </div>
      </div>

      <a class="preferences-card" href="#" onclick="return false;" style="cursor: default;" aria-label="Preferences">
        <img class="preferences-icon" src="../src/Preferences-logo.png" alt="" aria-hidden="true"/>
        <span>Preferences</span>
        <svg class="preferences-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 5 7 7-7 7"/>
        </svg>
      </a>

      <a class="course-reference" href="../src/2568_CS@TU_Orientation_Final%202.pdf" target="_blank" rel="noopener noreferrer">
        หลักสูตรอ้างอิง
      </a>
    </main>
  </div>

  <script src="../app.js"></script>
  <script>
    const nameEl = document.getElementById("p-name");
    const idEl = document.getElementById("p-id");
    const facultyEl = document.getElementById("p-faculty");
    const programEl = document.getElementById("p-program");
    const yearEl = document.getElementById("p-year");
    const profileCard = document.getElementById("profile-card");
    const profileLoading = document.getElementById("profile-loading");
    const profileError = document.getElementById("profile-error");
    const profileRetry = document.getElementById("profile-retry");

    function showProfileError(message) {
      profileLoading.hidden = true;
      profileCard.hidden = true;
      profileError.textContent = message;
      profileError.classList.add("show");
      profileRetry.hidden = false;
    }

    async function loadProfile(verifiedUser) {
      profileLoading.hidden = false;
      profileError.classList.remove("show");
      profileRetry.hidden = true;
      profileCard.hidden = true;
      profileRetry.disabled = true;

      try {
        const user = verifiedUser || await apiRequest("/auth/me");
        if (!user || typeof user.displayName !== "string" ||
            typeof user.studentId !== "string" ||
            (user.year !== null && (!Number.isInteger(user.year) || user.year < 1)) ||
            typeof user.faculty !== "string" ||
            typeof user.department !== "string") {
          throw new Error("ข้อมูลโปรไฟล์จาก backend ไม่ครบตาม API contract");
        }

        nameEl.textContent = user.displayName;
        idEl.textContent = user.studentId;
        facultyEl.textContent = user.faculty;
        programEl.textContent = user.department ? `สาขา${user.department}` : "";
        yearEl.textContent = user.year === null ? "ไม่ระบุ" : String(user.year);

        profileLoading.hidden = true;
        profileCard.hidden = false;
      } catch (error) {
        const message = error instanceof TypeError
          ? "เชื่อมต่อ backend ไม่ได้ กรุณาตรวจสอบว่า backend ทำงานอยู่และลองอีกครั้ง"
          : error.message || "โหลดข้อมูลโปรไฟล์ไม่สำเร็จ";
        showProfileError(message);
      } finally {
        profileRetry.disabled = false;
      }
    }

    profileRetry.addEventListener("click", loadProfile);

    async function initializeProfilePage() {
      const verifiedUser = await requireAuth();
      if (!verifiedUser) return;

      renderTopbar();
      loadProfile(verifiedUser);
    }

    initializeProfilePage();
  </script>
</body>
</html>
