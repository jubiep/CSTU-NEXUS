<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/login.css"/>
  
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
      <img src="../src/login-logo.png" alt="CSTU NEXUS logo" width="250"/>
      </div>

      <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>

      <form id="login-form">
        <div class="form-group">
          <input class="form-input" type="text" id="student-id" name="studentId" placeholder="เลขนักศึกษา 10 หลัก" autocomplete="username" aria-label="เลขนักศึกษา" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="กรุณากรอกเลขนักศึกษา 10 หลัก" required/>
        </div>

        <div class="form-group">
          <input class="form-input" type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" aria-label="รหัสผ่าน" required/>
        </div>

        <button class="btn btn-primary" id="login-button" type="submit" aria-busy="false">
          <span class="login-spinner" id="login-spinner" aria-hidden="true" hidden></span>
          <span id="login-button-label">Log in</span>
        </button>
      </form>

      <p class="login-note">
        ยืนยันตัวตนผ่าน TU Authentication<br/>
        ใช้บัญชีนักศึกษา TU ที่เปิดใช้งาน
      </p>
    </div>
  </div>

  <script src="../app.js"></script>
  <script>
    if (sessionStorage.getItem(AUTH_STATE_KEY)) {
      window.location.href = "courses.html";
    }

    const loginForm = document.getElementById("login-form");
    const loginButton = document.getElementById("login-button");
    const loginSpinner = document.getElementById("login-spinner");
    const loginButtonLabel = document.getElementById("login-button-label");
    const studentIdInput = document.getElementById("student-id");
    const passwordInput = document.getElementById("password");
    const err = document.getElementById("error-msg");

    const reason = getParam("reason");
    if (reason === "session-expired") {
      showLoginError("เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง");
    } else if (reason === "backend-disconnected") {
      showLoginError("การเชื่อมต่อกับ backend หลุด กรุณาเข้าสู่ระบบอีกครั้ง");
    } else if (reason === "logout-failed") {
      showLoginError("ออกจากระบบบนอุปกรณ์นี้แล้ว แต่ backend ติดต่อไม่ได้ เซสชันฝั่ง server อาจยังไม่ถูกยกเลิก");
    }

    function showLoginError(message) {
      err.textContent = message;
      err.classList.add("show");
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      err.textContent = "";
      err.classList.remove("show");
      loginButton.disabled = true;
      loginButton.setAttribute("aria-busy", "true");
      loginButton.setAttribute("aria-label", "กำลังเข้าสู่ระบบ");
      loginSpinner.hidden = false;
      loginButtonLabel.hidden = true;

      try {
        const result = await apiRequest("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            username: studentIdInput.value.trim(),
            password: passwordInput.value,
          }),
        });

        if (!result || !result.user || typeof result.user !== "object" || Array.isArray(result.user)) {
          throw new Error("ข้อมูลตอบกลับจาก backend ไม่ถูกต้อง");
        }

        sessionStorage.setItem(AUTH_STATE_KEY, "1");
        window.location.replace("courses.html");
      } catch (error) {
        if (error instanceof TypeError) {
          showLoginError("เชื่อมต่อ backend ไม่ได้ กรุณาตรวจสอบว่า backend ทำงานอยู่และลองอีกครั้ง");
        } else if (error.status === 401) {
          showLoginError("เลขนักศึกษาหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบแล้วลองอีกครั้ง");
        } else {
          showLoginError(error.message || "เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่");
        }
      } finally {
        loginButton.disabled = false;
        loginButton.setAttribute("aria-busy", "false");
        loginButton.removeAttribute("aria-label");
        loginSpinner.hidden = true;
        loginButtonLabel.hidden = false;
      }
    });
  </script>
</body>
</html>
