<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – Learning Preferences</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/preferences.css"/>
</head>
<body>
  <div class="app-shell">
    <header id="topbar"></header>

    <main class="page-content preferences-page">
      <div class="preferences-title-wrap">
        <span class="preferences-accent" aria-hidden="true"></span>
        <h1>Learning Preferences</h1>
      </div>
      <p class="preferences-intro">เลือกรูปแบบการเรียนที่ตรงกับคุณที่สุด เพื่อใช้ประกอบการคำนวณ Match Score</p>

      <p id="preferences-loading" class="preferences-status" role="status">กำลังโหลด Preferences...</p>
      <div id="preferences-error" class="preferences-error" role="alert" aria-live="polite" hidden></div>
      <button id="preferences-retry" class="btn btn-outline preferences-retry" type="button" hidden>ลองโหลดอีกครั้ง</button>

      <form id="preferences-form" hidden>
        <div id="preference-groups" class="preference-groups"></div>
        <p class="preferences-hint">ยังไม่เลือกได้ และสามารถกลับมาแก้ไขภายหลังได้</p>
        <div class="preferences-actions">
          <a class="preferences-back" href="profile.html">ย้อนกลับ</a>
          <button id="preferences-save" class="preferences-save" type="submit">บันทึก</button>
        </div>
        <p id="preferences-save-status" class="preferences-save-status" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>

  <script src="../app.js"></script>
  <script>
    const preferenceDefinitions = [
      {
        key: "teachingStyle",
        title: "แนวทางการสอน",
        options: ["เน้นทฤษฎี", "สมดุล", "เน้นปฏิบัติ"]
      },
      {
        key: "assessmentStyle",
        title: "สัดส่วนการวัดผลและตัดเกรด",
        options: ["เน้นคะแนนสอบ", "สมดุล", "เน้นโครงงาน"]
      },
      {
        key: "teachingSpeed",
        title: "ความเร็วในการสอน",
        options: ["สอนช้า", "ปานกลาง", "สอนเร็ว"]
      },
      {
        key: "workFormat",
        title: "รูปแบบงาน",
        options: ["เน้นงานเดี่ยว", "สมดุล", "เน้นงานกลุ่ม"]
      },
      {
        key: "workloadTolerance",
        title: "ปริมาณงานที่รับได้",
        options: ["รับงานได้น้อย", "รับงานได้ปานกลาง", "รับงานได้มาก"]
      }
    ];

    const preferenceValues = [0, 50, 100];
    const form = document.getElementById("preferences-form");
    const groupsEl = document.getElementById("preference-groups");
    const loadingEl = document.getElementById("preferences-loading");
    const errorEl = document.getElementById("preferences-error");
    const retryButton = document.getElementById("preferences-retry");
    const saveButton = document.getElementById("preferences-save");
    const saveStatus = document.getElementById("preferences-save-status");

    function renderPreferenceGroups(preferences = {}) {
      groupsEl.innerHTML = preferenceDefinitions.map(definition => `
        <fieldset class="preference-card">
          <legend>${definition.title}</legend>
          <div class="preference-hearts">
            ${definition.options.map((option, index) => {
              const value = preferenceValues[index];
              const id = `pref-${definition.key}-${value}`;
              const checked = preferences[definition.key] === value ? "checked" : "";
              return `
                <label class="preference-choice" for="${id}">
                  <input id="${id}" type="radio" name="${definition.key}" value="${value}" ${checked}/>
                  <span class="heart-icon" aria-hidden="true">♡</span>
                  <span class="preference-choice-label">${option}</span>
                </label>`;
            }).join("")}
          </div>
        </fieldset>
      `).join("");
    }

    async function loadPreferences() {
      loadingEl.hidden = false;
      errorEl.hidden = true;
      retryButton.hidden = true;
      form.hidden = true;

      try {
        const preferences = await apiRequest("/preferences");
        renderPreferenceGroups(preferences || {});
        form.hidden = false;
      } catch (error) {
        errorEl.textContent = error.message || "โหลด Preferences ไม่สำเร็จ กรุณาลองอีกครั้ง";
        errorEl.hidden = false;
        retryButton.hidden = false;
      } finally {
        loadingEl.hidden = true;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      saveButton.disabled = true;
      saveButton.textContent = "กำลังบันทึก...";
      saveStatus.textContent = "";
      saveStatus.classList.remove("is-error");

      const preferences = Object.fromEntries(preferenceDefinitions.map(definition => {
        const selected = form.querySelector(`input[name="${definition.key}"]:checked`);
        return [definition.key, selected ? Number(selected.value) : null];
      }));

      try {
        await apiRequest("/preferences", {
          method: "PUT",
          body: JSON.stringify(preferences)
        });
        saveStatus.textContent = "บันทึก Preferences แล้ว";
      } catch (error) {
        saveStatus.textContent = error.message || "บันทึกไม่สำเร็จ กรุณาลองอีกครั้ง";
        saveStatus.classList.add("is-error");
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "บันทึก";
      }
    });

    retryButton.addEventListener("click", loadPreferences);

    requireAuth().then(user => {
      if (!user) return;
      renderTopbar();
      loadPreferences();
    });
  </script>
</body>
</html>
