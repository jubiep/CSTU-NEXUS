<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – รายวิชา</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/course-detail.css"/>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <header id="topbar"></header>

    <div class="page-content">
      <!-- Course header (UI Section ส่วนบน) -->
      <div class="course-detail-header">
        <div class="course-header-left">
          <div class="course-accent-bar"></div>
          <div class="course-header-info">
            <h1 class="course-code" id="detail-code"></h1>
            <div class="course-fullname" id="detail-name"></div>
            <div class="course-teacher" id="detail-teacher"></div>
          </div>
        </div>
        <button class="section-pill-btn" id="section-badge" onclick="toggleSection()" type="button">
          <span>กรุณาเลือก Section</span>
          <img src="../src/chevron-down-icon.png" alt="chevron down icon" height="14" width="14"/>
        </button>
      </div>

      <!-- Section selector (hidden by default) -->
      <div id="section-panel" class="section-panel" style="display:none;">
        <div class="section-panel-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div class="section-panel-title" style="margin-bottom:0;">เลือก Section</div>
            <span id="section-count-badge" style="font-size:12px; color:var(--gray-500); font-weight:500;"></span>
          </div>

          <div id="section-list" class="section-list-wrap"></div>
        </div>
      </div>

      <!-- Write some Review Section -->
      <div class="section-title-wrap">
        <div class="section-accent-bar"></div>
        <h2 class="section-title-text">Write some Review</h2>
      </div>

      <!-- Write Review Card -->
      <a href="write-review.html" id="write-btn" class="write-review-card">
        <div class="write-review-card-text">
          <div>คุณได้รับสิทธิ์แบ่งปันประสบการณ์</div>
          <div>รายวิชา <span id="write-course-code"></span></div>
        </div>
        <div class="write-review-card-icon">
          <img src="../src/edit-icon.png" alt="edit icon" height="30" width="30"/>
        </div>
      </a>

      <!-- Reviews Section -->
      <div class="section-title-wrap">
        <div class="section-accent-bar"></div>
        <h2 class="section-title-text">Reviews</h2>
      </div>

      <!-- Container สำหรับแสดงรายการรีวิวแนวตั้ง -->
      <div id="review-list" class="review-list"></div>

      <!-- Pagination (ปุ่มเลขหน้า 1, 2, <, >) -->
      <div class="pagination" id="pagination"></div>
    </div>

  </div>

  <script src="../app.js"></script>
  <script>
    requireAuth().then(user => {
    if (!user) return;
    renderTopbar();

    const code = getParam("code") || "CS261";
    let courseData = null;
    let allSections = [];
    let selectedSection = getParam("section") || "";
    let selectedSectionId = "";

    const topbarCode = document.getElementById("topbar-code");
    if (topbarCode) topbarCode.textContent = code;
    const badgeText = document.querySelector("#section-badge span");
    const sectionList = document.getElementById("section-list");
    const sectionCountBadge = document.getElementById("section-count-badge");
    const teacherEl = document.getElementById("detail-teacher");

    let hasReviewedCourse = false;
    let eligibilityData = null;

    function checkIfUserReviewedThisCourse() {
      if (hasReviewedCourse) return true;
      const studentId = user && user.studentId;
      if (!studentId) return false;

      if (localStorage.getItem(`cstu_reviewed_${code}_${studentId}`) === "true") {
        return true;
      }
      try {
        const storedKey = `cstu_reviews_${code}`;
        const localList = JSON.parse(localStorage.getItem(storedKey) || "[]");
        if (localList.some(r => r.studentId === studentId)) {
          return true;
        }
      } catch (e) {}

      if (typeof mockReviews !== "undefined" && mockReviews[code]) {
        if (mockReviews[code].some(r => r.studentId === studentId)) {
          return true;
        }
      }
      return false;
    }

    function setReviewedState() {
      const writeBtn = document.getElementById("write-btn");
      if (!writeBtn) return;
      writeBtn.style.display = "flex";
      writeBtn.className = "reviewed-card";
      writeBtn.removeAttribute("href");
      writeBtn.onclick = null;
      writeBtn.innerHTML = `
        <div class="reviewed-card-content">
          <div class="reviewed-icon-wrap" aria-hidden="true">
            <img src="../src/success-icon.png" alt="verified icon" height="28" width="28"/>
          </div>
          <span class="reviewed-text">คุณเคยแบ่งปันประสบการณ์แล้ว</span>
        </div>`;
    }

    function setIneligibleState(message) {
      const writeBtn = document.getElementById("write-btn");
      if (!writeBtn) return;
      writeBtn.style.display = "flex";
      writeBtn.className = "write-review-card disabled";
      writeBtn.removeAttribute("href");
      writeBtn.onclick = event => event.preventDefault();
      const writeText = writeBtn.querySelector(".write-review-card-text");
      if (writeText) {
        writeText.innerHTML = `<div>${message || "ยังไม่มีสิทธิ์เขียนรีวิว"}</div>`;
      }
    }

    function updateWriteBtn() {
      const writeBtn = document.getElementById("write-btn");
      const writeText = document.querySelector(".write-review-card-text");
      if (!writeBtn) return;

      // 1 คนเรียนได้ 1 เซค เพราะฉะนั้นจะรีวิวได้เพียง 1 เซค 1 ครั้ง รีวิวไปแล้วจะไปรีวิวอีกเซคในวิชาเดียวกันไม่ได้
      if (hasReviewedCourse || checkIfUserReviewedThisCourse()) {
        hasReviewedCourse = true;
        setReviewedState();
        return;
      }

      if (eligibilityData && eligibilityData.alreadyReviewed) {
        hasReviewedCourse = true;
        setReviewedState();
        return;
      }

      if (eligibilityData && !eligibilityData.eligible) {
        setIneligibleState(eligibilityData.message || "ยังไม่มีสิทธิ์เขียนรีวิว");
        return;
      }

      if (!selectedSection) {
        writeBtn.style.display = "flex";
        writeBtn.className = "write-review-card disabled";
        writeBtn.removeAttribute("href");
        writeBtn.onclick = (e) => {
          e.preventDefault();
          const panel = document.getElementById("section-panel");
          if (panel) {
            panel.style.display = "block";
            panel.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        };
        if (writeText) {
          writeText.innerHTML = `
            <div>คุณได้รับสิทธิ์แบ่งปันประสบการณ์</div>
            <div>รายวิชา <span id="write-course-code">${code}</span> <span style="color:#DC2626; font-size:12px; font-weight:600;">(กรุณาเลือก Section ก่อนเริ่มเขียนรีวิว)</span></div>
          `;
        }
        return;
      }

      writeBtn.style.display = "flex";
      writeBtn.className = "write-review-card";
      writeBtn.href = `write-review.html?code=${encodeURIComponent(code)}&section=${encodeURIComponent(selectedSection)}&sectionId=${encodeURIComponent(selectedSectionId)}`;
      writeBtn.onclick = null;
      if (writeText) {
        writeText.innerHTML = `
          <div>คุณได้รับสิทธิ์แบ่งปันประสบการณ์</div>
          <div>รายวิชา <span id="write-course-code">${code}</span> (Section ${selectedSection})</div>
        `;
      }
    }

    function toggleSection() {
      // หากไม่มี Section ไม่ต้องเปิดแผงเลือก
      if (!allSections || allSections.length === 0) return;
      const panel = document.getElementById("section-panel");
      const btn = document.getElementById("section-badge");
      if (!panel) return;
      const isHidden = panel.style.display === "none" || !panel.style.display;
      panel.style.display = isHidden ? "block" : "none";
      if (btn) {
        btn.classList.toggle("open", isHidden);
        const arrow = btn.querySelector("img");
        if (arrow) {
          arrow.src = isHidden ? "../src/chevron-up-icon.png" : "../src/chevron-down-icon.png";
        }
      }
    }
    window.toggleSection = toggleSection;

    // Render รายการปุ่ม Section
    function renderSectionButtons(list) {
      if (!sectionList) return;
      sectionList.innerHTML = "";

      if (!list || list.length === 0) {
        sectionList.innerHTML = `<span style="font-size:13px; color:var(--gray-400);">วิชานี้ไม่มี Section (รีวิวรวมรายวิชา)</span>`;
        return;
      }

      list.forEach(s => {
        const secNum = typeof s === "object" ? s.sectionNumber : s;
        const secId = typeof s === "object" ? s.sectionId : `sec_${s}`;
        const instructor = typeof s === "object" && s.instructorName ? s.instructorName : "";
        const isSelected = Boolean(selectedSection) && (String(secNum).trim() === String(selectedSection).trim());

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `section-btn-item ${isSelected ? 'active' : ''}`;
        btn.textContent = `Section ${secNum}`;

        btn.onclick = () => {
          selectedSection = secNum;
          selectedSectionId = secId;
          if (badgeText) badgeText.textContent = "Section " + secNum;
          if (instructor && teacherEl) {
            teacherEl.textContent = instructor;
          } else if (teacherEl) {
            teacherEl.textContent = courseData.teacher || "ไม่ระบุผู้สอน";
          }
          updateWriteBtn();
          checkReviewPermission();
          renderSectionButtons(allSections); // อัปเดตสถานะ active
          toggleSection(); // ปิดแผงเมื่อเลือกแล้ว
          loadReviews(); // โหลดรีวิวของ Section ที่เลือก
        };

        sectionList.appendChild(btn);
      });
    }

    // เริ่มต้นโหลดข้อมูลวิชาและเซกชันจาก API (GET /api/courses/{id})
    async function initCourseDetail() {
      try {
        // ยิง API (มี fallback ไปยัง mock ใน app.js)
        courseData = await apiFetchCourseDetail(code);
      } catch (err) {
        console.error("Load course detail error:", err);
      }

      if (!courseData) {
        document.body.innerHTML = "<p style='padding:40px;text-align:center;'>ไม่พบรายวิชา</p>";
        return;
      }

      // แสดงข้อมูลส่วน Header
      document.getElementById("detail-code").textContent = courseData.courseId || code;
      document.getElementById("detail-name").textContent = courseData.courseName || courseData.name || "";
      
      const writeCourseCode = document.getElementById("write-course-code");
      if (writeCourseCode) writeCourseCode.textContent = courseData.courseId || code;

      // จัดการเซกชัน
      allSections = courseData.sections || [];
      const hasSections = Array.isArray(allSections) && allSections.length > 0;
      if (sectionCountBadge) {
        sectionCountBadge.textContent = `${allSections.length} section`;
      }

      if (!hasSections) {
        // กรณีวิชาไม่มี Section: เป็นการรีวิวรวมรายวิชา (ไม่ต้องกรอก section ก็เข้าถึงข้อมูลหรือกดรีวิวได้)
        selectedSection = "";
        selectedSectionId = "";
        if (badgeText) badgeText.textContent = "รีวิวรวมรายวิชา";
        if (teacherEl) teacherEl.textContent = courseData.teacher || "ไม่ระบุผู้สอน";
        const badgeBtn = document.getElementById("section-badge");
        if (badgeBtn) {
          badgeBtn.style.cursor = "default";
          const arrow = badgeBtn.querySelector("img");
          if (arrow) arrow.style.display = "none";
        }
      } else if (selectedSection) {
        // ตรวจสอบว่ามี section ที่ส่งมาจาก URL หรือไม่ (Test case 6)
        const found = allSections.find(s => 
          String(typeof s === "object" ? s.sectionNumber : s).trim() === String(selectedSection).trim()
        );
        if (found) {
          selectedSection = String(typeof found === "object" ? found.sectionNumber : found).trim();
          selectedSectionId = typeof found === "object" ? found.sectionId : `sec_${found}`;
          const instructor = typeof found === "object" && found.instructorName ? found.instructorName : (courseData.teacher || "");
          if (teacherEl) teacherEl.textContent = instructor;
          if (badgeText) badgeText.textContent = "Section " + selectedSection;
        } else {

          // หากเลข section ใน URL ไม่ตรงกับที่มี ให้กลับสู่ค่าเริ่มต้น (Test case 1)
          selectedSection = "";
          selectedSectionId = "";
          if (badgeText) badgeText.textContent = "กรุณาเลือก Section";
          if (teacherEl) teacherEl.textContent = "กรุณาเลือก Section";
        }
      } else {
        // ค่าเริ่มต้น: มี Section แต่ยังไม่ได้เลือก Section ใดๆ (Test case 1)
        selectedSection = "";
        selectedSectionId = "";
        if (badgeText) badgeText.textContent = "กรุณาเลือก Section";
        if (teacherEl) teacherEl.textContent = "กรุณาเลือก Section";
      }

      updateWriteBtn();
      renderSectionButtons(allSections);
      loadReviews();
      checkReviewPermission();
    }

    initCourseDetail();

    async function checkReviewPermission() {
      if (hasReviewedCourse || checkIfUserReviewedThisCourse()) {
        hasReviewedCourse = true;
        setReviewedState();
        return;
      }

      try {
        const res = await apiRequest(`/courses/${encodeURIComponent(code)}/reviews/eligibility`);
        eligibilityData = res;
        if (res && res.alreadyReviewed) {
          hasReviewedCourse = true;
          setReviewedState();
        } else if (res && !res.eligible) {
          setIneligibleState(res.message || "ยังไม่มีสิทธิ์เขียนรีวิว");
        } else {
          updateWriteBtn();
        }
      } catch (err) {
        console.error("Check permission error:", err);
        if (checkIfUserReviewedThisCourse()) {
          hasReviewedCourse = true;
          setReviewedState();
        } else {
          updateWriteBtn();
        }
      }
    }

    let allReviews = [];
    let currentPage = 1;
    const REVIEWS_PER_PAGE = typeof ITEMS_PER_PAGE !== "undefined" ? ITEMS_PER_PAGE : 5;

    function renderReviewsPage() {
      const reviewList = document.getElementById("review-list");
      const paginationEl = document.getElementById("pagination");
      if (!reviewList) return;

      if (!allReviews || allReviews.length === 0) {
        reviewList.innerHTML = `<p style="text-align:center;color:var(--gray-400);padding:32px 0;font-size:14px;">ยังไม่มีรีวิว — เป็นคนแรกที่รีวิวรายวิชานี้!</p>`;
        if (paginationEl) paginationEl.innerHTML = "";
        return;
      }

      const totalPages = Math.ceil(allReviews.length / REVIEWS_PER_PAGE);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * REVIEWS_PER_PAGE;
      const currentSlice = allReviews.slice(startIndex, startIndex + REVIEWS_PER_PAGE);

      // Render รายการรีวิวแนวตั้ง (Vertical list) สูงสุด 5 รายการต่อหน้า
      reviewList.innerHTML = currentSlice.map(r => {
        const yearText = r.year ? `ชั้นปีที่ ${r.year}` : '';
        const dateText = r.date || '10/10/2569';
        const isAnonymous = Boolean(r.isAnonymous || r.anonymous);
        const anonymousYear = Number(r.reviewerYear || r.year);
        const anonymousPrefixByYear = { 1: "69", 2: "68", 3: "67", 4: "66" };
        const anonymousStudentId = /^\d{2}\*{8}$/.test(r.author || "")
          ? r.author
          : `${anonymousPrefixByYear[anonymousYear] || "**"}********`;
        const studentId = isAnonymous ? anonymousStudentId : (r.studentId || r.authorStudentId || "ไม่พบรหัสนักศึกษา");
        
        // จัดรูปแบบแท็ก Section
        const rawSection = r.sectionNumber || r.sectionId || '';
        const displaySection = String(rawSection).includes('_') ? String(rawSection).split('_').pop() : rawSection;
        const sectionBadgeHtml = displaySection 
          ? `<span class="review-section-badge">Section ${displaySection}</span>` 
          : `<span class="review-section-badge general">ทั่วไป</span>`;

        // จัดรูปแบบแท็กการประเมิน (Tags)
        const tagsList = Array.isArray(r.tags) && r.tags.length > 0
          ? r.tags
          : ["เน้นทฤษฎี", "สมดุล"];
        const tagsHtml = `
          <div class="review-tags-wrap">
            ${tagsList.map(t => `<span class="review-tag-badge">${t}</span>`).join('')}
          </div>
        `;

        const commentText = (r.text || r.comment || "").trim();
        const hasComment = commentText && commentText !== "-";
        const commentHtml = hasComment ? `
          <div class="review-comment-box">
            <p class="review-comment-text">${commentText}</p>
          </div>` : "";

        return `
          <div class="review-card">
            <div class="review-card-top">
              <div class="review-user-info">
                <div class="review-verified-shield">
                  <img src="../src/verify-icon.png" alt="verified icon" height="30" width="30"/>
                </div>
                <span class="review-student-id"${isAnonymous ? ' aria-label="เลขนักศึกษาที่ปกปิดบางส่วน"' : ''}>${studentId}</span>
                ${sectionBadgeHtml}
              </div>
              <span class="review-date">${dateText}</span>
            </div>
            ${tagsHtml}
            ${commentHtml}
          </div>`;
      }).join('');

      if (!paginationEl) return;

      if (totalPages <= 1) {
        paginationEl.innerHTML = `
          <button class="page-btn arrow" type="button" disabled aria-label="หน้าก่อนหน้า">‹</button>
          <button class="page-btn active" type="button" data-page="1">1</button>
          <button class="page-btn arrow" type="button" disabled aria-label="หน้าถัดไป">›</button>
        `;
        return;
      }

      let paginationHtml = `
        <button class="page-btn arrow" type="button" id="review-prev-btn" ${currentPage === 1 ? 'disabled' : ''} aria-label="หน้าก่อนหน้า">‹</button>
      `;

      for (let p = 1; p <= totalPages; p++) {
        paginationHtml += `
          <button class="page-btn ${p === currentPage ? 'active' : ''}" type="button" data-page="${p}">${p}</button>
        `;
      }

      paginationHtml += `
        <button class="page-btn arrow" type="button" id="review-next-btn" ${currentPage === totalPages ? 'disabled' : ''} aria-label="หน้าถัดไป">›</button>
      `;

      paginationEl.innerHTML = paginationHtml;

      const prevBtn = document.getElementById("review-prev-btn");
      if (prevBtn) {
        prevBtn.onclick = () => {
          if (currentPage > 1) {
            currentPage--;
            renderReviewsPage();
            reviewList.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        };
      }

      const nextBtn = document.getElementById("review-next-btn");
      if (nextBtn) {
        nextBtn.onclick = () => {
          if (currentPage < totalPages) {
            currentPage++;
            renderReviewsPage();
            reviewList.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        };
      }

      paginationEl.querySelectorAll("button[data-page]").forEach(btn => {
        btn.onclick = () => {
          const targetPage = parseInt(btn.getAttribute("data-page"), 10);
          if (targetPage && targetPage !== currentPage) {
            currentPage = targetPage;
            renderReviewsPage();
            reviewList.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        };
      });
    }

    async function loadReviews() {
      const reviewList = document.getElementById("review-list");
      const paginationEl = document.getElementById("pagination");

      const mergeReviewsWithoutDuplicates = (preferred, fallback) => {
        const merged = [];
        const seenStudents = new Set();
        [...preferred, ...fallback].forEach(review => {
          const studentId = String(review.studentId || review.authorStudentId || "").trim();
          if (studentId && seenStudents.has(studentId)) return;
          if (studentId) seenStudents.add(studentId);
          merged.push(review);
        });
        return merged;
      };

      reviewList.innerHTML = `<p style="text-align:center;color:var(--gray-400);padding:32px 0;font-size:14px;">กำลังโหลดรีวิว...</p>`;
      if (paginationEl) paginationEl.innerHTML = "";

      try {
        let url = `/courses/${encodeURIComponent(code)}/reviews`;
        if (selectedSectionId) {
          url += `?sectionId=${encodeURIComponent(selectedSectionId)}`;
        }

        const res = await apiRequest(url);
        allReviews = Array.isArray(res) ? res : (res && res.reviews ? res.reviews : []);

        // หาก Backend ส่งค่าว่างกลับมา (ยังไม่มีข้อมูลใน DB) ให้ fallback ไปดึงจาก mockReviews
        if (allReviews.length === 0 && typeof getReviews === "function") {
          allReviews = getReviews(code, selectedSection) || [];
        }

        // รวมรีวิวที่ผู้ใช้เพิ่งเขียนและบันทึกไว้ใน localStorage (โครงสร้างข้อมูลส่วน frontend)
        try {
          const storedKey = `cstu_reviews_${code}`;
          let localList = JSON.parse(localStorage.getItem(storedKey) || "[]");
          if (selectedSection) {
            localList = localList.filter(r => !r.sectionNumber || String(r.sectionNumber).trim() === String(selectedSection).trim());
          }
          if (localList.length > 0) {
            allReviews = mergeReviewsWithoutDuplicates(localList, allReviews);
          }
        } catch (storageErr) {
          console.warn("Could not load reviews from localStorage:", storageErr);
        }
      } catch (err) {
        console.warn("Failed to load reviews from API, using fallback if available:", err);
        if (typeof getReviews === "function") {
          allReviews = getReviews(code, selectedSection) || [];
        }

        // รวมรีวิวที่ผู้ใช้เพิ่งเขียนและบันทึกไว้ใน localStorage (โครงสร้างข้อมูลส่วน frontend)
        try {
          const storedKey = `cstu_reviews_${code}`;
          let localList = JSON.parse(localStorage.getItem(storedKey) || "[]");
          if (selectedSection) {
            localList = localList.filter(r => !r.sectionNumber || String(r.sectionNumber).trim() === String(selectedSection).trim());
          }
          if (localList.length > 0) {
            allReviews = mergeReviewsWithoutDuplicates(localList, allReviews);
          }
        } catch (storageErr) {
          console.warn("Could not load reviews from localStorage:", storageErr);


        }
      }

      currentPage = 1;
      renderReviewsPage();
    }
    });
  </script>
</body>
</html>
