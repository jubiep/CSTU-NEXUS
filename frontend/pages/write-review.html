<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – เขียนรีวิว</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/write-review.css"/>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <header id="topbar"></header>

    <div class="page-content">
      <!-- Course info -->
      <div class="course-detail-header">
        <div class="course-header-left">
          <div class="course-accent-bar"></div>
          <div class="course-header-info">
            <h1 class="course-code" id="detail-code"></h1>
            <div class="course-fullname" id="detail-name"></div>
            <div class="course-teacher" id="detail-teacher"></div>
          </div>
        </div>
        <div class="section-pill-badge" id="section-badge">
          <span id="section-text">Section</span>
        </div>
      </div>

      <!-- Write some Review Section -->
      <div class="section-title-wrap">
        <div class="section-accent-bar"></div>
        <h2 class="section-title-text">Write some Review</h2>
      </div>

      <!-- 1. แนวทางการสอน -->
      <div class="rating-card">
        <div class="rating-card-header">แนวทางการสอน</div>
        <div class="rating-options-list">
          <label class="rating-option">
            <input type="radio" name="teaching_method" value="เน้นทฤษฎี">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">เน้นทฤษฎี</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="teaching_method" value="สมดุล">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">สมดุล</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="teaching_method" value="เน้นปฏิบัติ">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">เน้นปฏิบัติ</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="teaching_method" value="ไม่แน่ใจ">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">ไม่แน่ใจ</span>
          </label>
        </div>
      </div>

      <!-- 2. สัดส่วนการวัดผลและตัดเกรด -->
      <div class="rating-card">
        <div class="rating-card-header">สัดส่วนการวัดผลและตัดเกรด</div>
        <div class="rating-options-list">
          <label class="rating-option">
            <input type="radio" name="evaluation" value="เน้นคะแนนสอบ">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">เน้นคะแนนสอบ</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="evaluation" value="สมดุล">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">สมดุล</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="evaluation" value="เน้นโครงงาน">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">เน้นโครงงาน</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="evaluation" value="ไม่แน่ใจ">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">ไม่แน่ใจ</span>
          </label>
        </div>
      </div>

      <!-- 3. ความเร็วในการสอน -->
      <div class="rating-card">
        <div class="rating-card-header">ความเร็วในการสอน</div>
        <div class="rating-options-list">
          <label class="rating-option">
            <input type="radio" name="teaching_speed" value="สอนเร็ว">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">สอนเร็ว</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="teaching_speed" value="ปานกลาง">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">ปานกลาง</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="teaching_speed" value="สอนช้า">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">สอนช้า</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="teaching_speed" value="ไม่แน่ใจ">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">ไม่แน่ใจ</span>
          </label>
        </div>
      </div>

      <!-- 4. รูปแบบงาน -->
      <div class="rating-card">
        <div class="rating-card-header">รูปแบบงาน</div>
        <div class="rating-options-list">
          <label class="rating-option">
            <input type="radio" name="assignment_style" value="เน้นงานเดี่ยว">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">เน้นงานเดี่ยว</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="assignment_style" value="สมดุล">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">สมดุล</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="assignment_style" value="เน้นงานกลุ่ม">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">เน้นงานกลุ่ม</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="assignment_style" value="ไม่แน่ใจ">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">ไม่แน่ใจ</span>
          </label>
        </div>
      </div>

      <!-- 5. ปริมาณงาน -->
      <div class="rating-card">
        <div class="rating-card-header">ปริมาณงาน</div>
        <div class="rating-options-list">
          <label class="rating-option">
            <input type="radio" name="workload" value="งานเยอะ">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">งานเยอะ</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="workload" value="ปริมาณงานสมดุล">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">ปริมาณงานสมดุล</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="workload" value="งานน้อย">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">งานน้อย</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="workload" value="ไม่แน่ใจ">
            <span class="custom-radio-icon"></span>
            <span class="rating-option-label">ไม่แน่ใจ</span>
          </label>
        </div>
      </div>

      <!-- Review Input Card -->
      <div class="review-input-card">
        <div class="review-input-header">
          รายละเอียดเพิ่มเติม
        </div>

        <div class="review-textarea-wrap">
          <textarea id="review-text" class="review-textarea" placeholder="เช่น สอนช้า เร็ว ปานกลาง มีวิดีโอบันทึกย้อนหลัง&#10;มีการเช็คชื่อ หรือมีการสุ่มตอบคำถาม เป็นต้น" rows="3"></textarea>
        </div>

        <div class="review-notice">
          <img src="../src/alert-icon.png" alt="warning icon" height="24" width="24"/>
          <span>กรุณาแบ่งปันประสบการณ์อย่างสุภาพ</span>
        </div>
      </div>

      <label class="anonymous-review-option" for="review-anonymous">
        <input id="review-anonymous" type="checkbox"/>
        <span><strong>เผยแพร่แบบไม่ระบุตัวตน</strong><small>ระบบจะแสดงเลข 2 หลักตามชั้นปี และปิดบังเลขที่เหลือ</small></span>
      </label>

      <!-- Validation error -->
      <div id="form-error" class="error-msg" style="display:none;margin-bottom:14px;">
        กรุณาเลือกการประเมินให้ครบทุกหมวดหมู่
      </div>

      <!-- Action buttons -->
      <div class="review-actions-wrap">
        <button class="btn-back-review" onclick="goBack()" type="button">ย้อนกลับ</button>
        <button class="btn-submit-review" onclick="submitReview()" type="button">ส่ง</button>
      </div>
      <span id="inline-code" style="display:none;"></span>
    </div>

    <!-- Success modal -->
    <div class="modal-overlay" id="success-modal">
      <div class="modal-box">
        <div class="modal-title">รีวิวเสร็จสิ้น</div>
        <img class="success-icon" src="../src/success-icon.png" alt="success icon" height="60" width="60"/>
        <button class="btn btn-primary btn-full" onclick="goBack()">ย้อนกลับ</button>
      </div>
    </div>

  </div>

  <script src="../app.js"></script>
  <script>
    const code = getParam("code") || "CS261";
    let section = getParam("section") || "";
    let sectionId = getParam("sectionId") || "";

    function goBack() {
      if (section) {
        window.location.href = `course-detail.html?code=${encodeURIComponent(code)}&section=${encodeURIComponent(section)}`;
      } else {
        window.location.href = `course-detail.html?code=${encodeURIComponent(code)}`;
      }
    }
    window.goBack = goBack;

    requireAuth().then(async user => {
      if (!user) return;

      renderTopbar();
      document.getElementById("detail-code").textContent = code;
      document.getElementById("inline-code").textContent = code;

      let course = null;
      try {
        course = await apiFetchCourseDetail(code);
      } catch (err) {
        course = getCourse(code);
      }
      if (!course) {
        course = getCourse(code);
      }

      const sectionText = document.getElementById("section-text");
      const nameEl = document.getElementById("detail-name");
      const teacherEl = document.getElementById("detail-teacher");

      if (course) {
        if (nameEl) nameEl.textContent = course.courseName || course.name || "";
        const sections = course.sections || [];
        const hasSections = Array.isArray(sections) && sections.length > 0;

        if (!hasSections || !section) {
          section = "";
          sectionId = "";
          if (sectionText) sectionText.textContent = "รีวิวรวมรายวิชา";
          if (teacherEl) teacherEl.textContent = course.teacher || "ไม่ระบุผู้สอน";
        } else {
          if (sectionText) sectionText.textContent = "Section " + section;
          const found = sections.find(s => String(typeof s === "object" ? s.sectionNumber : s).trim() === String(section).trim());
          if (found && typeof found === "object") {
            if (found.sectionId) sectionId = found.sectionId;
            if (found.instructorName && teacherEl) teacherEl.textContent = found.instructorName;
          } else if (teacherEl) {
            teacherEl.textContent = course.teacher || "ไม่ระบุผู้สอน";
          }
        }
      } else {
        if (sectionText) {
          sectionText.textContent = section ? "Section " + section : "รีวิวรวมรายวิชา";
        }
      }

      // ตรวจสอบว่าเคยรีวิววิชานี้แล้วหรือไม่ (1 คนรีวิวได้เพียง 1 เซกชันในแต่ละรายวิชา)
      function checkIfUserReviewedThisCourse() {
        const studentId = user && user.studentId;
        if (!studentId) return false;
        if (localStorage.getItem(`cstu_reviewed_${code}_${studentId}`) === "true") {
          return true;
        }
        try {
          const storedKey = `cstu_reviews_${code}`;
          const localList = JSON.parse(localStorage.getItem(storedKey) || "[]");
          if (localList.some(r => r.studentId === studentId)) {
            return true;
          }
        } catch (e) {}
        if (typeof mockReviews !== "undefined" && mockReviews[code]) {
          if (mockReviews[code].some(r => r.studentId === studentId)) {
            return true;
          }
        }
        return false;
      }

      let alreadyReviewed = checkIfUserReviewedThisCourse();

      // ตรวจสอบสิทธิ์รีวิวของนักศึกษา
      try {
        const eligibility = await apiRequest(`/courses/${encodeURIComponent(code)}/reviews/eligibility`);
        if (eligibility) {
          if (eligibility.alreadyReviewed) {
            alreadyReviewed = true;
          } else if (!eligibility.eligible) {
            const errEl = document.getElementById("form-error");
            errEl.textContent = eligibility.message || "คุณไม่มีสิทธิ์รีวิวรายวิชานี้ หรือได้เคยส่งรีวิวไปแล้ว";
            errEl.style.display = "block";
            const submitBtn = document.querySelector(".btn-submit-review");
            if (submitBtn) {
              submitBtn.disabled = true;
              submitBtn.style.opacity = "0.5";
              submitBtn.style.cursor = "not-allowed";
            }
          }
        }
      } catch (err) {
        console.warn("Could not check eligibility upfront:", err);
      }

      if (alreadyReviewed) {
        const errEl = document.getElementById("form-error");
        errEl.textContent = "คุณเคยแบ่งปันประสบการณ์รายวิชานี้แล้ว (1 คนสามารถรีวิวได้เพียง 1 เซกชันในแต่ละรายวิชา)";
        errEl.style.display = "block";
        const submitBtn = document.querySelector(".btn-submit-review");
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.style.opacity = "0.5";
          submitBtn.style.cursor = "not-allowed";
        }
      }

      const dimensionKeys = [
        { name: "teaching_method", label: "แนวทางการสอน" },
        { name: "evaluation", label: "สัดส่วนการวัดผลและตัดเกรด" },
        { name: "teaching_speed", label: "ความเร็วในการสอน" },
        { name: "assignment_style", label: "รูปแบบงาน" },
        { name: "workload", label: "ปริมาณงาน" }
      ];

      // Form Validation: ตรวจสอบว่าเลือกครบทั้ง 5 หัวข้อหรือยัง เพื่อเปิด/ปิดปุ่มส่ง
      function validateFormCompletion() {
        const submitBtn = document.querySelector(".btn-submit-review");
        if (!submitBtn) return false;
        if (alreadyReviewed || checkIfUserReviewedThisCourse()) {
          submitBtn.disabled = true;
          return false;
        }

        const isComplete = dimensionKeys.every(dim => {
          const checked = document.querySelector(`input[name="${dim.name}"]:checked`);
          return checked && checked.value;
        });

        submitBtn.disabled = !isComplete;
        return isComplete;
      }

      // ดักจับการเลือก radio ทุกข้อแบบ Real-time
      document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener("change", () => {
          const isComplete = validateFormCompletion();
          const errEl = document.getElementById("form-error");
          if (errEl && isComplete) {
            errEl.style.display = "none";
          }
        });
      });

      // ตรวจสอบสถานะฟอร์มครั้งแรกตอนโหลดหน้า
      validateFormCompletion();

      window.submitReview = async function submitReviewHandler() {
        const errEl = document.getElementById("form-error");
        const submitBtn = document.querySelector(".btn-submit-review");

        if (alreadyReviewed || checkIfUserReviewedThisCourse()) {
          errEl.textContent = "คุณได้เคยส่งรีวิวรายวิชานี้ไปแล้ว ไม่สามารถรีวิวเซกชันอื่นในวิชาเดียวกันได้";
          errEl.style.display = "block";
          if (submitBtn) {
            submitBtn.disabled = true;
          }
          return;
        }

        // ตรวจสอบว่าเลือกครบทุกหมวดหมู่การประเมินหรือไม่
        const selectedTags = [];
        const ratings = {};
        const missingCategories = [];

        dimensionKeys.forEach(dim => {
          const checked = document.querySelector(`input[name="${dim.name}"]:checked`);
          if (checked && checked.value) {
            ratings[dim.name] = checked.value;
            selectedTags.push(checked.value);
          } else {
            missingCategories.push(dim.label);
          }
        });

        if (missingCategories.length > 0) {
          errEl.textContent = "กรุณาเลือกการประเมินให้ครบทุกหมวดหมู่";
          errEl.style.display = "block";
          errEl.scrollIntoView({ behavior: "smooth", block: "center" });
          if (submitBtn) submitBtn.disabled = true;
          return;
        }

        // ข้อความรีวิว (text) ไม่จำเป็นต้องเขียน
        const textarea = document.getElementById("review-text");
        const text = textarea ? textarea.value.trim() : "";
        errEl.style.display = "none";

        // บันทึกรีวิวพร้อมแท็กและคะแนนสเกล 0-1 ไว้ใน localStorage เพื่อแสดงผลทันทีในหน้ารายละเอียดวิชา
        const currentStudentId = (user && user.studentId) || "";
        const dimensionScores = typeof normalizeRatings === "function" ? normalizeRatings(ratings) : {};
        try {
          const storedKey = `cstu_reviews_${code}`;
          const currentLocal = JSON.parse(localStorage.getItem(storedKey) || "[]");
          const newReviewItem = {
            id: Date.now(),
            courseId: code,
            sectionNumber: section || "",
            sectionId: sectionId || null,
            studentId: currentStudentId,
            year: (user && user.year) || 2,
            date: new Date().toLocaleDateString("th-TH", { day: "numeric", month: "numeric", year: "numeric" }).replace(/\//g, "-"),
            tags: selectedTags.length > 0 ? selectedTags : ["เน้นทฤษฎี"],
            ratings: ratings,
            scores: dimensionScores,
            text: text,
            comment: text
          };
          currentLocal.unshift(newReviewItem);
          localStorage.setItem(storedKey, JSON.stringify(currentLocal));
          if (currentStudentId) {
            localStorage.setItem(`cstu_reviewed_${code}_${currentStudentId}`, "true");
          }
        } catch (storageErr) {
          console.warn("Could not save to localStorage:", storageErr);
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "กำลังส่ง...";

        try {
          // เรียกใช้งานฟังก์ชัน submitReview ใน app.js ที่ส่งค่าทั้ง 5 เกณฑ์ไปยัง Backend
          if (typeof window.submitReview === "function" && window.submitReview !== submitReviewHandler) {
            await window.submitReview(code, {
              sectionId: sectionId || null,
              reviewText: text,
              comment: text,
              text: text,
              isAnonymous: document.getElementById("review-anonymous").checked
            }),
          });

          if (currentStudentId) {
            localStorage.setItem(`cstu_reviewed_${code}_${currentStudentId}`, "true");
          }
          alreadyReviewed = true;
          document.getElementById("success-modal").classList.add("show");
        } catch (error) {
          console.error("Failed to submit review:", error);
          errEl.textContent = error.message || "เกิดข้อผิดพลาดในการส่งรีวิว กรุณาลองใหม่อีกครั้ง";
          errEl.style.display = "block";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "ส่ง";
          validateFormCompletion();
        }
      };
    });
  </script>
</body>
</html>
