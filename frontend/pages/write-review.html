<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>CSTU NEXUS – เขียนรีวิว</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/write-review.css"/>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <header id="topbar"></header>

    <div class="page-content">
      <!-- Course info -->
      <div class="course-detail-header">
        <div class="course-header-left">
          <div class="course-accent-bar"></div>
          <div class="course-header-info">
            <h1 class="course-code" id="detail-code"></h1>
            <div class="course-fullname" id="detail-name"></div>
            <div class="course-teacher" id="detail-teacher"></div>
          </div>
        </div>
        <div class="section-pill-badge" id="section-badge">
          <span id="section-text">Section</span>
        </div>
      </div>

      <!-- Write some Review Section -->
      <div class="section-title-wrap">
        <div class="section-accent-bar"></div>
        <h2 class="section-title-text">Write some Review</h2>
      </div>

      <!-- Review Input Card -->
      <div class="review-input-card">
        <div class="review-input-header">
          รายละเอียดเพิ่มเติม
        </div>

        <div class="review-textarea-wrap">
          <textarea id="review-text" class="review-textarea" placeholder="เช่น สอนช้า เร็ว ปานกลาง มีวิดีโอบันทึกย้อนหลัง&#10;มีการเช็คชื่อ หรือมีการสุ่มตอบคำถาม เป็นต้น" rows="3"></textarea>
        </div>

        <div class="review-notice">
          <img src="../src/alert-icon.png" alt="warning icon" height="24" width="24"/>
          <span>กรุณาแบ่งปันประสบการณ์อย่างสุภาพ</span>
        </div>
      </div>

      <!-- Validation error -->
      <div id="form-error" class="error-msg" style="display:none;margin-bottom:14px;">
        กรุณาเขียนรีวิวก่อนส่ง
      </div>

      <!-- Action buttons -->
      <div class="review-actions-wrap">
        <button class="btn-back-review" onclick="goBack()" type="button">ย้อนกลับ</button>
        <button class="btn-submit-review" onclick="submitReview()" type="button">ส่ง</button>
      </div>
      <span id="inline-code" style="display:none;"></span>
    </div>

    <!-- Success modal -->
    <div class="modal-overlay" id="success-modal">
      <div class="modal-box">
        <div class="modal-title">รีวิวเสร็จสิ้น</div>
        <img class="success-icon" src="../src/success-icon.png" alt="success icon" height="60" width="60"/>
        <button class="btn btn-primary btn-full" onclick="goBack()">ย้อนกลับ</button>
      </div>
    </div>

  </div>

  <script src="../app.js"></script>
  <script>
    const code = getParam("code") || "CS261";
    let section = getParam("section") || "";
    let sectionId = getParam("sectionId") || "";

    function goBack() {
      if (section) {
        window.location.href = `course-detail.html?code=${encodeURIComponent(code)}&section=${encodeURIComponent(section)}`;
      } else {
        window.location.href = `course-detail.html?code=${encodeURIComponent(code)}`;
      }
    }
    window.goBack = goBack;

    requireAuth().then(async user => {
      if (!user) return;

      renderTopbar();
      document.getElementById("detail-code").textContent = code;
      document.getElementById("inline-code").textContent = code;

      let course = null;
      try {
        course = await apiFetchCourseDetail(code);
      } catch (err) {
        course = getCourse(code);
      }
      if (!course) {
        course = getCourse(code);
      }

      const sectionText = document.getElementById("section-text");
      const nameEl = document.getElementById("detail-name");
      const teacherEl = document.getElementById("detail-teacher");

      if (course) {
        if (nameEl) nameEl.textContent = course.courseName || course.name || "";
        const sections = course.sections || [];
        const hasSections = Array.isArray(sections) && sections.length > 0;

        if (!hasSections || !section) {
          section = "";
          sectionId = "";
          if (sectionText) sectionText.textContent = "รีวิวรวมรายวิชา";
          if (teacherEl) teacherEl.textContent = course.teacher || "ไม่ระบุผู้สอน";
        } else {
          if (sectionText) sectionText.textContent = "Section " + section;
          const found = sections.find(s => String(typeof s === "object" ? s.sectionNumber : s).trim() === String(section).trim());
          if (found && typeof found === "object") {
            if (found.sectionId) sectionId = found.sectionId;
            if (found.instructorName && teacherEl) teacherEl.textContent = found.instructorName;
          } else if (teacherEl) {
            teacherEl.textContent = course.teacher || "ไม่ระบุผู้สอน";
          }
        }
      } else {
        if (sectionText) {
          sectionText.textContent = section ? "Section " + section : "รีวิวรวมรายวิชา";
        }
      }

      // ตรวจสอบสิทธิ์รีวิวของนักศึกษา
      try {
        const eligibility = await apiRequest(`/courses/${encodeURIComponent(code)}/reviews/eligibility`);
        if (eligibility && !eligibility.eligible) {
          const errEl = document.getElementById("form-error");
          errEl.textContent = eligibility.message || "คุณไม่มีสิทธิ์รีวิวรายวิชานี้ หรือได้เคยส่งรีวิวไปแล้ว";
          errEl.style.display = "block";
          const submitBtn = document.querySelector(".btn-submit-review");
          if (submitBtn) submitBtn.disabled = true;
        }
      } catch (err) {
        console.warn("Could not check eligibility upfront:", err);
      }

      window.submitReview = async function submitReview() {
        const textarea = document.getElementById("review-text");
        const text = textarea.value.trim();
        const errEl = document.getElementById("form-error");
        const submitBtn = document.querySelector(".btn-submit-review");

        if (!text) {
          errEl.textContent = "กรุณากรอกข้อความรีวิวก่อนส่ง";
          errEl.style.display = "block";
          textarea.focus();
          return;
        }
        errEl.style.display = "none";

        submitBtn.disabled = true;
        submitBtn.textContent = "กำลังส่ง...";

        try {
          await apiRequest(`/courses/${encodeURIComponent(code)}/reviews`, {
            method: "POST",
            body: JSON.stringify({
              sectionId: sectionId || null,
              reviewText: text,
              comment: text,
              text: text
            }),
          });

          document.getElementById("success-modal").classList.add("show");
        } catch (error) {
          console.error("Failed to submit review:", error);
          errEl.textContent = error.message || "เกิดข้อผิดพลาดในการส่งรีวิว กรุณาลองใหม่อีกครั้ง";
          errEl.style.display = "block";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "ส่ง";
        }
      };
    });
  </script>
</body>
</html>
